# Release Automation Reusable Workflow
#
# This reusable workflow orchestrates the CAMARA release automation process.
# It handles:
# - Slash commands: /create-snapshot, /discard-snapshot, /delete-draft,
#   /publish-release, /sync-issue
# - Issue events: close (with auto-reopen if needed), reopen
# - PR merge events: on release-snapshot branches (draft creation)
# - Push: Release Issue sync of the pushed line (main or maintenance/rX)
# - Manual dispatch: action input sync-issue (default) or
#   create-maintenance-branch with a cycle input
#
# Four jobs: plan decides (one JSON plan), snapshot or act executes the
# plan's action (one JSON outcome), finalize reports and syncs.
#
# Called by: release-automation-caller.yml in API repositories

name: CAMARA Release Automation

on:
  workflow_call:
    inputs:
      # Passed from caller for workflow_dispatch
      command:
        description: "Command to execute (for workflow_dispatch)"
        type: string
        required: false
        default: ""
      reason:
        description: "Reason for discard/delete commands"
        type: string
        required: false
        default: ""

env:
  # Keep release automation runtime pins explicit and aligned with validation.
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Plan — resolve the trigger and its release line, then derive the state,
  # apply the command policy and post the one response (ack update,
  # rejection, config error or publish confirmation). Writes the plan document
  # the other jobs read; nothing is derived again after this job.
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      action: ${{ steps.plan.outputs.action }}
      finalize: ${{ steps.plan.outputs.finalize }}
      # The acknowledgment updated with interim_processing; finalize replaces
      # it with the result comment.
      result_comment_id: ${{ steps.plan.outputs.result_comment_id }}
    steps:
      - name: Fork Guard - Check Issues Enabled
        id: fork-guard
        env:
          HAS_ISSUES: ${{ github.event.repository.has_issues }}
        run: |
          if [ "$HAS_ISSUES" = "true" ]; then
            echo "issues_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "issues_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Issues disabled — Release Automation skipped::To use Release Automation here, enable Issues in repository Settings → General → Features. To stop Release Automation from running on this fork, disable the Release Automation workflow."
          fi

      # Post early acknowledgment for slash commands, before any checkout so it
      # lands within seconds. Later updated by Plan with the policy's
      # template. Uses GITHUB_TOKEN (not App token) to avoid
      # triggering extra workflow runs. The command list mirrors COMMANDS in
      # release_automation/scripts/commands.py, pinned by
      # validation/tests/test_release_automation_workflow.py.
      - name: Post Acknowledgment
        id: ack
        if: |
          steps.fork-guard.outputs.issues_enabled == 'true' &&
          github.event_name == 'issue_comment' &&
          contains(github.event.issue.labels.*.name, 'release-issue')
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const body = (context.payload.comment.body || '').trim();
            const match = body.match(/^\/(create-snapshot|discard-snapshot|delete-draft|sync-issue|publish-release)(?:\s|$)/);
            if (!match) return;

            const command = match[1];
            const user = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = `<!-- release-bot:ack:${context.runId} -->`;

            const ackBody = [
              marker,
              `**\u23F3 Validating \`/${command}\`...**`,
              `**Requested by:** @${user} \u00B7 [View workflow run](${runUrl})`,
              '',
              'This comment will be updated with the result. If this stays visible unusually long, open the workflow run above.'
            ].join('\n');

            const result = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: ackBody
            });

            console.log(`Ack comment created: ${result.data.id}`);
            core.setOutput('comment_id', result.data.id.toString());

      - name: Checkout tooling
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Setup Python
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        run: pip install --quiet -r _tooling/requirements.txt

      # The event → Trigger, and the branch whose release-plan.yaml the run
      # works on: main or maintenance/rX (the ref of a push or dispatch, the
      # line of the tag the Release Issue or the snapshot branch names otherwise).
      - name: Resolve trigger and release line
        id: resolve
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        working-directory: _tooling
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m release_automation.scripts.release_line

      # The base branch's common files, for the cache check in Plan
      - name: Checkout API repo (sparse, for cache sync check)
        if: steps.resolve.outputs.should_continue == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.base_branch }}
          path: _api_repo
          sparse-checkout: |
            code/common
          sparse-checkout-cone-mode: true

      # Derives the release state, checks the common cache, applies the
      # command policy, posts the one response comment (interim status,
      # rejection, configuration error or publish confirmation; GITHUB_TOKEN,
      # like every Release Issue write), writes the summary and the plan.
      # Fails the job for a refused dispatch action and for a configuration
      # error on a push or dispatch (no comment to post; the log says how to fix).
      - name: Plan
        id: plan
        if: steps.resolve.outputs.should_continue == 'true'
        working-directory: _tooling
        env:
          TRIGGER_JSON: ${{ steps.resolve.outputs.trigger }}
          BASE_BRANCH: ${{ steps.resolve.outputs.base_branch }}
          API_REPO_PATH: ${{ github.workspace }}/_api_repo
          ACK_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m release_automation.scripts.command_policy

  # ─────────────────────────────────────────────────────────────────────────────
  # Snapshot — /create-snapshot: pre-snapshot validation, snapshot branch,
  # release-review branch and Release PR. Own job for the validation toolchain.
  # ─────────────────────────────────────────────────────────────────────────────
  snapshot:
    needs: [plan]
    if: needs.plan.outputs.action == 'create-snapshot'
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      # ── Pre-snapshot validation ────────────────────────────────────
      #
      # Run the validation framework on the source branch before
      # creating the snapshot.  Profile from per-repo config
      # (default: standard — errors block snapshot creation).

      - name: Checkout repository for validation
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).base_branch }}
          path: _repo

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --quiet -r _tooling/requirements.txt

      # Deliberately no `cache: npm` here, unlike the validation reusable
      # workflow.  Snapshot creation is slash-command driven, so this job
      # always runs on an `issue_comment` event, and the Actions cache
      # token for that event is read-only ("cache write denied: token has
      # no writable scopes").  The step could therefore never populate a
      # cache, and no default-branch entry exists to restore from, so the
      # only observable effect was a failed-save warning annotation on
      # every release run.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Central validation settings (main) ─────────────────────────
      #
      # Pre-snapshot validation reads `config/validation-settings.yaml`
      # from `main` of camaraproject/tooling so a stage flip on main takes
      # effect on the next snapshot run without a tag move.
      #
      # No fallback to the pinned-ref copy here — release automation
      # produces durable artifacts (snapshots, release branches, eventually
      # tags and releases) and must not silently use stale config. If main
      # is unreachable, this step fails before any irreversible action.
      # This differs from the validation reusable workflow, which is
      # read-only and falls back to the pinned-ref copy with a warning.
      - name: Checkout central validation settings (main)
        uses: actions/checkout@v7
        with:
          repository: camaraproject/tooling
          ref: main
          sparse-checkout: config
          path: _tooling-config

      - name: Validate central settings against schema
        working-directory: _tooling
        env:
          SETTINGS_PATH: ${{ github.workspace }}/_tooling-config/config/validation-settings.yaml
          SCHEMA_PATH: ${{ github.workspace }}/_tooling/validation/schemas/validation-settings-schema.yaml
        run: python -m release_automation.scripts.snapshot_prep settings

      - name: Resolve published release history
        id: release-history
        if: hashFiles('_repo/release-plan.yaml') != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          BASE_REF: ${{ fromJSON(needs.plan.outputs.plan).base_branch }}
        run: |
          python3 _tooling/validation/scripts/resolve-release-history.py \
            --repo "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --output "${RUNNER_TEMP}/release-history.json"

      - name: Run pre-snapshot validation
        id: validation
        uses: ./_tooling/shared-actions/run-validation
        with:
          repo_path: ${{ github.workspace }}/_repo
          tooling_path: ${{ github.workspace }}/_tooling
          mode: pre-snapshot
          tooling_ref: ${{ job.workflow_sha }}
          config_path: ${{ github.workspace }}/_tooling-config/config/validation-settings.yaml
          release_history_path: ${{ steps.release-history.outputs.release_history_path || '' }}

      - name: Gate on validation result
        id: validation-gate
        if: always() && steps.validation.outputs.should_fail == 'true'
        working-directory: _tooling
        env:
          VALIDATION_SUMMARY: ${{ steps.validation.outputs.summary }}
        run: python -m release_automation.scripts.snapshot_prep gate

      # ── Snapshot creation ─────────────────────────────────────────

      - name: Resolve Bot Identity
        id: bot-identity
        working-directory: _tooling
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          ISSUE_TOKEN: ${{ github.token }}
          APP_TOKEN_USED: ${{ steps.app-token.outputs.token != '' }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        run: python -m release_automation.scripts.snapshot_prep bot-identity

      # The snapshot, release-review branch and Release PR of the plan's
      # release, with the App token (branch protection bypass, commit identity)
      - name: Create Snapshot
        id: create
        working-directory: _tooling
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TOOLING_PATH: ${{ github.workspace }}/_tooling
          BOT_NAME: ${{ steps.bot-identity.outputs.bot_name }}
          BOT_EMAIL: ${{ steps.bot-identity.outputs.bot_email }}
        run: python -m release_automation.scripts.snapshot_prep create

      - name: Outcome
        id: outcome
        if: always()
        working-directory: _tooling
        env:
          CREATE_JSON: ${{ toJSON(steps.create.outputs) }}
          GATE_JSON: ${{ toJSON(steps.validation-gate.outputs) }}
          VALIDATION_RESULT: ${{ steps.validation.outputs.result }}
        run: python -m release_automation.scripts.act snapshot

  # ─────────────────────────────────────────────────────────────────────────────
  # Act — the plan's other actions (discard-snapshot, delete-draft,
  # publish-release, create-draft, publish-on-merge, reopen-issue,
  # create-maintenance-branch), dispatched by release_automation/scripts/act.py.
  # The App token writes .github/workflows/* for create-maintenance-branch
  # (workflows permission) and bypasses maintenance-branch-protection;
  # Release Issue writes use ISSUE_TOKEN (GITHUB_TOKEN, triggers no run).
  # ─────────────────────────────────────────────────────────────────────────────
  act:
    needs: [plan]
    if: needs.plan.outputs.action != '' && needs.plan.outputs.action != 'create-snapshot'
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.act.outputs.outcome }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --quiet -r _tooling/requirements.txt

      # The action is in the step name: a skipped job's name expression is not
      # evaluated.
      - name: Act (${{ needs.plan.outputs.action }})
        id: act
        working-directory: _tooling
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          ISSUE_TOKEN: ${{ github.token }}
        run: python -m release_automation.scripts.act

  # ─────────────────────────────────────────────────────────────────────────────
  # Finalize — post-release sync PR, common sync, Release Issue sync
  # and notifications, result comment, published Release Issue. Runs after
  # snapshot/act even when they failed; release_automation/scripts/finalize.py
  # decides which parts apply from the plan and the outcome. Sync PRs and
  # common sync use the App token, Release Issue writes ISSUE_TOKEN.
  # ─────────────────────────────────────────────────────────────────────────────
  finalize:
    needs: [plan, snapshot, act]
    if: always() && needs.plan.outputs.finalize == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --quiet -r _tooling/requirements.txt

      - name: Finalize
        working-directory: _tooling
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          ISSUE_TOKEN: ${{ github.token }}
          APP_TOKEN_USED: ${{ steps.app-token.outputs.token != '' }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        run: python -m release_automation.scripts.finalize
