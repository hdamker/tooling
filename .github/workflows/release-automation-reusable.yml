# Release Automation Reusable Workflow
#
# This reusable workflow orchestrates the CAMARA release automation process.
# It handles:
# - Slash commands: /create-snapshot, /discard-snapshot, /delete-draft, /sync-issue
# - Issue events: close (with auto-reopen if needed), reopen
# - PR merge events: on release-snapshot branches (draft creation)
# - Manual dispatch: for testing and recovery
#
# Called by: release-automation-caller.yml in API repositories

name: CAMARA Release Automation

on:
  workflow_call:
    inputs:
      # Passed from caller for workflow_dispatch
      command:
        description: "Command to execute (for workflow_dispatch)"
        type: string
        required: false
        default: ""
      reason:
        description: "Reason for discard/delete commands"
        type: string
        required: false
        default: ""

env:
  # Keep release automation runtime pins explicit and aligned with validation.
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 1: Plan — classify the trigger, derive state, apply the command
  # policy, post the one response (ack update, rejection, config error or
  # publish confirmation).
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.policy.outputs.plan }}
      # Compatibility outputs under the names of the former check-trigger,
      # derive-state and post-interim jobs, so the jobs after plan read them
      # unchanged; removed when those jobs move into act/finalize.
      trigger_type: ${{ steps.detect.outputs.trigger_type }}
      command: ${{ steps.detect.outputs.command }}
      command_args: ${{ steps.detect.outputs.command_args }}
      issue_number: ${{ steps.detect.outputs.issue_number }}
      user: ${{ steps.detect.outputs.user }}
      should_continue: ${{ steps.detect.outputs.should_continue }}
      confirm_tag: ${{ steps.detect.outputs.confirm_tag }}
      trigger: ${{ steps.detect.outputs.trigger }}
      release_tag: ${{ steps.state.outputs.release_tag }}
      state: ${{ steps.state.outputs.state }}
      snapshot_id: ${{ steps.state.outputs.snapshot_id }}
      snapshot_branch: ${{ steps.state.outputs.snapshot_branch }}
      release_review_branch: ${{ steps.state.outputs.release_review_branch }}
      release_pr_number: ${{ steps.state.outputs.release_pr_number }}
      release_issue_number: ${{ steps.state.outputs.release_issue_number }}
      src_commit_sha: ${{ steps.state.outputs.src_commit_sha }}
      release_type: ${{ steps.state.outputs.release_type }}
      apis_json: ${{ steps.state.outputs.apis_json }}
      commonalities_release: ${{ steps.state.outputs.commonalities_release }}
      identity_consent_management_release: ${{ steps.state.outputs.identity_consent_management_release }}
      source: ${{ steps.state.outputs.source }}
      config_error: ${{ steps.state.outputs.config_error }}
      config_error_type: ${{ steps.state.outputs.config_error_type }}
      release_plan_url: ${{ steps.state.outputs.release_plan_url }}
      src_commit_sha_short: ${{ steps.state.outputs.src_commit_sha_short }}
      meta_release: ${{ steps.state.outputs.meta_release }}
      common_cache_status: ${{ steps.cache-sync.outputs.common_cache_status }}
      common_cache_details: ${{ steps.cache-sync.outputs.common_cache_details }}
      common_sync_pr_url: ${{ steps.cache-sync.outputs.common_sync_pr_url }}
      allowed: ${{ steps.policy.outputs.allowed }}
      error_message: ${{ steps.policy.outputs.error_message }}
      base_context: ${{ steps.assemble.outputs.base_context }}
      comment_id: ${{ steps.respond.outputs.comment_id || steps.ack.outputs.comment_id }}
      # True where the former post-interim job succeeded
      interim_posted: ${{ steps.policy.outputs.response == 'interim_processing' && steps.respond.outcome == 'success' }}
    steps:
      - name: Fork Guard - Check Issues Enabled
        id: fork-guard
        env:
          HAS_ISSUES: ${{ github.event.repository.has_issues }}
        run: |
          if [ "$HAS_ISSUES" = "true" ]; then
            echo "issues_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "issues_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Issues disabled — Release Automation skipped::To use Release Automation here, enable Issues in repository Settings → General → Features. To stop Release Automation from running on this fork, disable the Release Automation workflow."
          fi

      # Post early acknowledgment for slash commands, before any checkout so it
      # lands within seconds. Later updated by Post Response with the policy's
      # template. Uses GITHUB_TOKEN (not App token) to avoid
      # triggering extra workflow runs. The command list mirrors SLASH_COMMANDS
      # in release_automation/scripts/trigger.py (checked by a pytest).
      - name: Post Acknowledgment
        id: ack
        if: |
          steps.fork-guard.outputs.issues_enabled == 'true' &&
          github.event_name == 'issue_comment' &&
          contains(github.event.issue.labels.*.name, 'release-issue')
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const body = (context.payload.comment.body || '').trim();
            const match = body.match(/^\/(create-snapshot|discard-snapshot|delete-draft|sync-issue|publish-release)(?:\s|$)/);
            if (!match) return;

            const command = match[1];
            const user = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = `<!-- release-bot:ack:${context.runId} -->`;

            const ackBody = [
              marker,
              `**\u23F3 Validating \`/${command}\`...**`,
              `**Requested by:** @${user} \u00B7 [View workflow run](${runUrl})`,
              '',
              'This comment will be updated with the result. If this stays visible unusually long, open the workflow run above.'
            ].join('\n');

            const result = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: ackBody
            });

            console.log(`Ack comment created: ${result.data.id}`);
            core.setOutput('comment_id', result.data.id.toString());

      - name: Checkout tooling
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Setup Python
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        run: pip install --quiet -r _tooling/requirements.txt

      # release_tag is NOT output here - it comes from Derive Release State, which
      # reads the authoritative sources (release-plan.yaml or release-metadata.yaml).
      - name: Detect Trigger Type
        id: detect
        if: steps.fork-guard.outputs.issues_enabled == 'true'
        working-directory: _tooling
        run: python -m release_automation.scripts.trigger

      - name: Derive Release State
        id: state
        if: steps.detect.outputs.should_continue == 'true'
        uses: ./_tooling/shared-actions/derive-release-state

      # ── Common file cache sync detection ──────────────────────────────
      - name: Checkout API repo (sparse, for cache sync check)
        if: |
          steps.state.outputs.config_error == '' &&
          steps.state.outputs.commonalities_release != ''
        uses: actions/checkout@v7
        with:
          path: _api_repo
          sparse-checkout: |
            code/common
          sparse-checkout-cone-mode: true

      - name: Check common cache sync
        id: cache-sync
        if: |
          steps.state.outputs.config_error == '' &&
          steps.state.outputs.commonalities_release != ''
        working-directory: _tooling
        env:
          API_REPO_PATH: ${{ github.workspace }}/_api_repo
          COMMONALITIES_RELEASE: ${{ steps.state.outputs.commonalities_release }}
          ICM_RELEASE: ${{ steps.state.outputs.identity_consent_management_release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m release_automation.scripts.common_sync

      # ── Command policy: Plan or Rejection, and the response to post ──
      - name: Apply Command Policy
        id: policy
        if: steps.detect.outputs.should_continue == 'true'
        working-directory: _tooling
        env:
          TRIGGER_JSON: ${{ steps.detect.outputs.trigger }}
          STATE: ${{ steps.state.outputs.state }}
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          RELEASE_TYPE: ${{ steps.state.outputs.release_type }}
          SRC_COMMIT_SHA: ${{ steps.state.outputs.src_commit_sha }}
          CONFIG_ERROR: ${{ steps.state.outputs.config_error }}
          CONFIG_ERROR_TYPE: ${{ steps.state.outputs.config_error_type }}
          COMMON_CACHE_STATUS: ${{ steps.cache-sync.outputs.common_cache_status }}
          COMMON_CACHE_DETAILS: ${{ steps.cache-sync.outputs.common_cache_details }}
          COMMON_SYNC_PR_URL: ${{ steps.cache-sync.outputs.common_sync_pr_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m release_automation.scripts.command_policy

      # ── Assemble Context (skipped on config error) ──
      - name: Assemble Context
        id: assemble
        if: |
          steps.detect.outputs.should_continue == 'true' &&
          steps.state.outputs.config_error == ''
        run: |
          python3 _tooling/release_automation/scripts/workflow_context.py
        env:
          CTX_COMMAND: ${{ steps.detect.outputs.command }}
          CTX_COMMAND_ARGS: ${{ steps.detect.outputs.command_args }}
          CTX_USER: ${{ steps.detect.outputs.user }}
          CTX_TRIGGER_TYPE: ${{ steps.detect.outputs.trigger_type }}
          CTX_RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          CTX_STATE: ${{ steps.state.outputs.state }}
          CTX_RELEASE_TYPE: ${{ steps.state.outputs.release_type }}
          CTX_META_RELEASE: ${{ steps.state.outputs.meta_release }}
          CTX_SNAPSHOT_ID: ${{ steps.state.outputs.snapshot_id }}
          CTX_SNAPSHOT_BRANCH: ${{ steps.state.outputs.snapshot_branch }}
          CTX_RELEASE_REVIEW_BRANCH: ${{ steps.state.outputs.release_review_branch }}
          CTX_RELEASE_PR_NUMBER: ${{ steps.state.outputs.release_pr_number }}
          CTX_SRC_COMMIT_SHA: ${{ steps.state.outputs.src_commit_sha }}
          CTX_APIS_JSON: ${{ steps.state.outputs.apis_json }}
          CTX_COMMONALITIES_RELEASE: ${{ steps.state.outputs.commonalities_release }}
          CTX_IDENTITY_CONSENT_MANAGEMENT_RELEASE: ${{ steps.state.outputs.identity_consent_management_release }}
          CTX_COMMON_CACHE_STATUS: ${{ steps.cache-sync.outputs.common_cache_status }}
          CTX_COMMON_CACHE_DETAILS: ${{ steps.cache-sync.outputs.common_cache_details }}
          GITHUB_TOKEN: ${{ github.token }}

      # ── Response: one bot comment, template chosen by the policy ──
      # interim_processing and command_rejected update the ack with GITHUB_TOKEN
      # (no extra issue_comment runs); config_error and publish_confirmation use
      # the App token, as their former jobs did. A failed interim post does not
      # stop the command (post-result then skips, as before).
      - name: Generate App Token
        id: app-token
        if: |
          (steps.policy.outputs.response == 'config_error' ||
           steps.policy.outputs.response == 'publish_confirmation') &&
          vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Post Response
        id: respond
        if: steps.policy.outputs.response != ''
        continue-on-error: ${{ steps.policy.outputs.response == 'interim_processing' }}
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          github_token: ${{ (steps.policy.outputs.response == 'config_error' || steps.policy.outputs.response == 'publish_confirmation') && steps.app-token.outputs.token || github.token }}
          issue_number: ${{ steps.detect.outputs.issue_number }}
          release_tag: ${{ steps.policy.outputs.response_release_tag }}
          run_id: ${{ github.run_id }}
          template: ${{ steps.policy.outputs.response }}
          base_context: ${{ steps.assemble.outputs.base_context || '{}' }}
          context: ${{ steps.policy.outputs.response_context }}
          comment_id: ${{ steps.ack.outputs.comment_id }}

      - name: Fail workflow (config error on a non-slash-command trigger)
        if: |
          steps.state.outputs.config_error != '' &&
          steps.detect.outputs.trigger_type != 'slash_command'
        env:
          CONFIG_ERROR: ${{ steps.state.outputs.config_error }}
          ERROR_TYPE: ${{ steps.state.outputs.config_error_type }}
        run: |
          echo "::error::Configuration Error: $CONFIG_ERROR"
          echo ""
          echo "Error type: $ERROR_TYPE"
          echo ""
          echo "How to fix:"
          case "$ERROR_TYPE" in
            missing_file)
              echo "  1. Create release-plan.yaml in repository root"
              echo "  2. Use the template from ReleaseManagement documentation"
              echo "  3. Commit and push to main branch"
              ;;
            malformed_yaml)
              echo "  1. Fix YAML syntax in release-plan.yaml"
              echo "  2. Validate with an online YAML validator"
              echo "  3. Commit and push the fix"
              ;;
            missing_field)
              echo "  1. Add the missing field to release-plan.yaml"
              echo "  2. Required: repository.target_release_tag"
              echo "  3. Commit and push the fix"
              ;;
          esac
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 5b: Execute create-snapshot command
  # ─────────────────────────────────────────────────────────────────────────────
  create-snapshot:
    needs: [plan]
    if: |
      needs.plan.outputs.command == 'create-snapshot' &&
      needs.plan.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.create.outputs.success || steps.validation-gate.outputs.success }}
      snapshot_id: ${{ steps.create.outputs.snapshot_id }}
      snapshot_branch: ${{ steps.create.outputs.snapshot_branch }}
      release_review_branch: ${{ steps.create.outputs.release_review_branch }}
      release_pr_number: ${{ steps.create.outputs.release_pr_number }}
      release_pr_url: ${{ steps.create.outputs.release_pr_url }}
      error_message: ${{ steps.create.outputs.error_message || steps.validation-gate.outputs.error_message }}
      apis_json: ${{ steps.create.outputs.apis_json }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      # ── Pre-snapshot validation ────────────────────────────────────
      #
      # Run the validation framework on the source branch before
      # creating the snapshot.  Profile from per-repo config
      # (default: standard — errors block snapshot creation).

      - name: Checkout repository for validation
        uses: actions/checkout@v7
        with:
          path: _repo

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Deliberately no `cache: npm` here, unlike the validation reusable
      # workflow.  Snapshot creation is slash-command driven, so this job
      # always runs on an `issue_comment` event, and the Actions cache
      # token for that event is read-only ("cache write denied: token has
      # no writable scopes").  The step could therefore never populate a
      # cache, and no default-branch entry exists to restore from, so the
      # only observable effect was a failed-save warning annotation on
      # every release run.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Central validation settings (main) ─────────────────────────
      #
      # Pre-snapshot validation reads `config/validation-settings.yaml`
      # from `main` of camaraproject/tooling so a stage flip on main takes
      # effect on the next snapshot run without a tag move.
      #
      # No fallback to the pinned-ref copy here — release automation
      # produces durable artifacts (snapshots, release branches, eventually
      # tags and releases) and must not silently use stale config. If main
      # is unreachable, this step fails before any irreversible action.
      # This differs from the validation reusable workflow, which is
      # read-only and falls back to the pinned-ref copy with a warning.
      - name: Checkout central validation settings (main)
        uses: actions/checkout@v7
        with:
          repository: camaraproject/tooling
          ref: main
          sparse-checkout: config
          path: _tooling-config

      - name: Validate central settings against schema
        shell: bash
        run: |
          pip install --quiet -r _tooling/requirements.txt
          python3 - <<'PY'
          import sys
          from pathlib import Path

          import yaml
          from jsonschema import Draft202012Validator

          config_path = Path("_tooling-config/config/validation-settings.yaml")
          schema_path = Path("_tooling/validation/schemas/validation-settings-schema.yaml")

          if not config_path.exists():
              print(
                  f"::error title=Validation settings missing::"
                  f"{config_path} not present on tooling/main; "
                  f"aborting before snapshot creation"
              )
              sys.exit(1)
          if not schema_path.exists():
              print(
                  f"::error title=Validation settings schema missing::"
                  f"{schema_path} not present on the pinned tooling ref"
              )
              sys.exit(1)

          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))
          schema = yaml.safe_load(schema_path.read_text(encoding="utf-8"))

          errors = list(Draft202012Validator(schema).iter_errors(config))
          if errors:
              for err in errors:
                  loc = ".".join(str(p) for p in err.absolute_path) or "(root)"
                  print(
                      f"::error title=Validation settings invalid::"
                      f"{loc}: {err.message}"
                  )
              print(
                  "::error::Aborting before snapshot creation — "
                  "validation settings on tooling/main fail schema validation"
              )
              sys.exit(1)

          print(f"Validation settings: {config_path} (main) — schema-valid")
          PY

      - name: Resolve published release history
        id: release-history
        if: hashFiles('_repo/release-plan.yaml') != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          python3 _tooling/validation/scripts/resolve-release-history.py \
            --repo "${{ github.repository }}" \
            --base-ref "${{ github.event.repository.default_branch || github.ref_name || 'main' }}" \
            --output "${RUNNER_TEMP}/release-history.json"

      - name: Run pre-snapshot validation
        id: validation
        uses: ./_tooling/shared-actions/run-validation
        with:
          repo_path: ${{ github.workspace }}/_repo
          tooling_path: ${{ github.workspace }}/_tooling
          mode: pre-snapshot
          tooling_ref: ${{ job.workflow_sha }}
          config_path: ${{ github.workspace }}/_tooling-config/config/validation-settings.yaml
          release_history_path: ${{ steps.release-history.outputs.release_history_path || '' }}

      - name: Gate on validation result
        id: validation-gate
        if: always() && steps.validation.outputs.should_fail == 'true'
        run: |
          echo "::error::Pre-snapshot validation failed — fix issues on main before re-running /create-snapshot"
          echo "success=false" >> "$GITHUB_OUTPUT"
          SUMMARY="${{ steps.validation.outputs.summary }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "error_message=Pre-snapshot validation failed: ${SUMMARY}. [View workflow logs](${RUN_URL})" >> "$GITHUB_OUTPUT"
          exit 1

      # ── Snapshot creation ─────────────────────────────────────────

      - name: Resolve Bot Identity
        id: bot-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -n "${{ vars.RELEASE_APP_SLUG }}" ] && [ -n "${{ steps.app-token.outputs.token }}" ]; then
            BOT_LOGIN="${{ vars.RELEASE_APP_SLUG }}[bot]"
          else
            BOT_LOGIN="github-actions[bot]"
          fi
          BOT_INFO=$(gh api "/users/$BOT_LOGIN" --jq '{id: .id, login: .login}')
          BOT_NAME=$(echo "$BOT_INFO" | jq -r '.login')
          BOT_ID=$(echo "$BOT_INFO" | jq -r '.id')
          echo "Committing as: $BOT_NAME <${BOT_ID}+${BOT_NAME}@users.noreply.github.com>"
          echo "bot_name=$BOT_NAME" >> $GITHUB_OUTPUT
          echo "bot_email=${BOT_ID}+${BOT_NAME}@users.noreply.github.com" >> $GITHUB_OUTPUT

      - name: Create Snapshot
        id: create
        uses: ./_tooling/shared-actions/create-snapshot
        with:
          release_tag: ${{ needs.plan.outputs.release_tag }}
          base_branch: main
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          tooling_path: ${{ github.workspace }}/_tooling
          bot_name: ${{ steps.bot-identity.outputs.bot_name }}
          bot_email: ${{ steps.bot-identity.outputs.bot_email }}

      - name: Log Result
        if: always()
        run: |
          echo "Pre-snapshot validation: ${{ steps.validation.outputs.result || 'skipped' }}"
          if [ "${{ steps.validation-gate.outcome }}" == "failure" ]; then
            echo "  Validation blocked snapshot creation"
            echo "  Summary: ${{ steps.validation.outputs.summary }}"
          fi
          echo "Create snapshot result:"
          echo "  Success: ${{ steps.create.outputs.success }}"
          echo "  Snapshot ID: ${{ steps.create.outputs.snapshot_id }}"
          echo "  Snapshot branch: ${{ steps.create.outputs.snapshot_branch }}"
          echo "  Release PR: #${{ steps.create.outputs.release_pr_number }}"
          if [ -n "${{ steps.create.outputs.error_message }}" ]; then
            echo "  Error: ${{ steps.create.outputs.error_message }}"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 5c: Execute discard-snapshot command
  # ─────────────────────────────────────────────────────────────────────────────
  discard-snapshot:
    needs: [plan]
    if: |
      needs.plan.outputs.command == 'discard-snapshot' &&
      needs.plan.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.discard.outputs.success }}
      error_message: ${{ steps.discard.outputs.error_message }}
      renamed_review_branch: ${{ steps.cleanup.outputs.renamed_review_branch }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Discard Snapshot
        id: discard
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const snapshotBranch = '${{ needs.plan.outputs.snapshot_branch }}';
            const prNumber = '${{ needs.plan.outputs.release_pr_number }}';
            const releaseTag = '${{ needs.plan.outputs.release_tag }}';

            console.log(`Discarding snapshot for ${releaseTag}`);
            console.log(`  Snapshot branch: ${snapshotBranch}`);
            console.log(`  Release PR: #${prNumber}`);

            try {
              // Step 1: Close Release PR (without merging)
              if (prNumber) {
                console.log(`Closing Release PR #${prNumber}...`);
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: parseInt(prNumber),
                  state: 'closed'
                });
                console.log('Release PR closed');
              }

              // Step 2: Delete snapshot branch
              if (snapshotBranch) {
                console.log(`Deleting snapshot branch: ${snapshotBranch}...`);
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${snapshotBranch}`
                });
                console.log('Snapshot branch deleted');
              }

              core.setOutput('success', 'true');
              core.setOutput('error_message', '');
            } catch (error) {
              console.log(`::error::Discard failed: ${error.message}`);
              core.setOutput('success', 'false');
              core.setOutput('error_message', error.message);
            }

      # Step 3: Rename review branch to free name for next create-snapshot
      - name: Cleanup review branch
        id: cleanup
        if: steps.discard.outputs.success == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const reviewBranch = '${{ needs.plan.outputs.release_review_branch }}';
            if (!reviewBranch) return;

            const newName = `${reviewBranch}-preserved`;
            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${reviewBranch}`
              });

              // Delete old -preserved branch if it exists (repeated cycles)
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo,
                  ref: `heads/${newName}`
                });
                console.log(`Deleted previous ${newName}`);
              } catch (_) { /* doesn't exist */ }

              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `refs/heads/${newName}`, sha: ref.data.object.sha
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `heads/${reviewBranch}`
              });
              console.log(`Renamed: ${reviewBranch} → ${newName}`);
              core.setOutput('renamed_review_branch', newName);
            } catch (e) {
              console.log(`Could not rename review branch: ${e.message}`);
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 5d: Execute delete-draft command
  # ─────────────────────────────────────────────────────────────────────────────
  delete-draft:
    needs: [plan]
    if: |
      needs.plan.outputs.command == 'delete-draft' &&
      needs.plan.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.delete.outputs.success }}
      error_message: ${{ steps.delete.outputs.error_message }}
      renamed_review_branch: ${{ steps.cleanup.outputs.renamed_review_branch }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Delete Draft Release
        id: delete
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const releaseTag = '${{ needs.plan.outputs.release_tag }}';
            const snapshotBranch = '${{ needs.plan.outputs.snapshot_branch }}';

            console.log(`Deleting draft release for ${releaseTag}`);
            console.log(`  Snapshot branch: ${snapshotBranch}`);

            try {
              // Step 1: Find and delete the draft release
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              const draftRelease = releases.data.find(
                r => r.tag_name === releaseTag && r.draft === true
              );

              if (draftRelease) {
                console.log(`Deleting draft release: ${draftRelease.name} (ID: ${draftRelease.id})`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: draftRelease.id
                });
                console.log('Draft release deleted');
              } else {
                console.log(`Warning: No draft release found for tag ${releaseTag}`);
              }

              // Step 2: Delete the release tag (created by draft release)
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${releaseTag}`
                });
                console.log(`Deleted tag: ${releaseTag}`);
              } catch (e) {
                // Tag may not exist (draft may not have created it)
                console.log(`Tag ${releaseTag} not found or already deleted`);
              }

              // Step 3: Delete snapshot branch
              if (snapshotBranch) {
                console.log(`Deleting snapshot branch: ${snapshotBranch}...`);
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${snapshotBranch}`
                });
                console.log('Snapshot branch deleted');
              }

              core.setOutput('success', 'true');
              core.setOutput('error_message', '');
            } catch (error) {
              console.log(`::error::Delete draft failed: ${error.message}`);
              core.setOutput('success', 'false');
              core.setOutput('error_message', error.message);
            }

      # Step 4: Rename review branch to free name for next create-snapshot
      - name: Cleanup review branch
        id: cleanup
        if: steps.delete.outputs.success == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const reviewBranch = '${{ needs.plan.outputs.release_review_branch }}';
            if (!reviewBranch) return;

            const newName = `${reviewBranch}-preserved`;
            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${reviewBranch}`
              });

              // Delete old -preserved branch if it exists (repeated cycles)
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo,
                  ref: `heads/${newName}`
                });
                console.log(`Deleted previous ${newName}`);
              } catch (_) { /* doesn't exist */ }

              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `refs/heads/${newName}`, sha: ref.data.object.sha
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `heads/${reviewBranch}`
              });
              console.log(`Renamed: ${reviewBranch} → ${newName}`);
              core.setOutput('renamed_review_branch', newName);
            } catch (e) {
              console.log(`Could not rename review branch: ${e.message}`);
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 5f: Handle publish-release (with --confirm flag)
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: "Publish Release"
    needs: [plan]
    if: |
      needs.plan.outputs.command == 'publish-release' &&
      needs.plan.outputs.confirm_tag != '' &&
      needs.plan.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.publish.outputs.success }}
      release_url: ${{ steps.publish.outputs.release_url }}
      reference_tag: ${{ steps.publish.outputs.reference_tag }}
      pointer_branch: ${{ steps.publish.outputs.pointer_branch }}
      error_message: ${{ steps.publish.outputs.error_message }}
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --quiet -r _tooling/requirements.txt

      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Execute Publish Flow
        id: publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          SNAPSHOT_BRANCH: ${{ needs.plan.outputs.snapshot_branch }}
          RELEASE_REVIEW_BRANCH: ${{ needs.plan.outputs.release_review_branch }}
          SRC_COMMIT_SHA: ${{ needs.plan.outputs.src_commit_sha }}
          RELEASE_ISSUE_NUMBER: ${{ needs.plan.outputs.release_issue_number }}
        run: |
          cd _tooling
          python3 -u - <<'PYTHON_SCRIPT'
          import os
          import sys
          import json

          sys.path.insert(0, '.')
          from release_automation.scripts.github_client import GitHubClient
          from release_automation.scripts.release_publisher import ReleasePublisher

          def set_output(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  # Handle multi-line values
                  if '\n' in str(value):
                      import uuid
                      delimiter = uuid.uuid4().hex
                      f.write(f'{name}<<{delimiter}\n{value}\n{delimiter}\n')
                  else:
                      f.write(f'{name}={value}\n')

          # Initialize clients
          token = os.environ['GITHUB_TOKEN']
          owner = os.environ['OWNER']
          repo = os.environ['REPO']
          release_tag = os.environ['RELEASE_TAG']
          snapshot_branch = os.environ['SNAPSHOT_BRANCH']
          release_review_branch = os.environ['RELEASE_REVIEW_BRANCH']
          src_commit_sha = os.environ['SRC_COMMIT_SHA']

          gh = GitHubClient(f'{owner}/{repo}', token)
          publisher = ReleasePublisher(gh)
          # Note: issue close moved to post-result job (after success message)
          # Note: sync PR creation moved to create-sync-pr job

          warnings = []
          release_url = ''
          reference_tag = ''
          pointer_branch = ''

          # Step 1: Publish the release (CRITICAL)
          print('Step 1: Publishing release...')
          publish_result = publisher.publish_release(release_tag, snapshot_branch)
          if not publish_result.success:
              set_output('success', 'false')
              set_output('error_message', publish_result.error_message or 'Unknown error')
              set_output('release_url', '')
              set_output('reference_tag', '')
              set_output('pointer_branch', '')
              print(f'::error::Publication failed: {publish_result.error_message}')
              sys.exit(0)  # Exit cleanly to allow post-result to run

          release_url = publish_result.release_url or ''
          is_prerelease = publish_result.is_prerelease
          print(f'Release published: {release_url}')

          # Step 2: Create reference tag (non-critical)
          print('Step 2: Creating reference tag...')
          ref_tag = publisher.create_reference_tag(release_tag, src_commit_sha)
          if ref_tag:
              reference_tag = ref_tag
              print(f'Reference tag created: {reference_tag}')
          else:
              warnings.append('Failed to create reference tag')
              print('::warning::Failed to create reference tag')

          # Step 3: Create pointer branch (non-critical)
          print('Step 3: Creating pointer branch...')
          ptr_branch = publisher.create_pointer_branch(release_tag, is_prerelease)
          if ptr_branch:
              pointer_branch = ptr_branch
              print(f'Pointer branch created: {pointer_branch}')
          else:
              warnings.append('Failed to create pointer branch')
              print('::warning::Failed to create pointer branch')

          # Step 4: Cleanup branches (non-critical)
          print('Step 4: Cleaning up branches...')
          cleanup_result = publisher.cleanup_branches(snapshot_branch, release_review_branch)
          for op, status in cleanup_result.items():
              if status == 'error':
                  warnings.append(f'Branch cleanup issue: {op}')
              print(f'  {op}: {status}')

          # Note: Issue close is done in post-result job AFTER success message

          # Set outputs
          set_output('success', 'true')
          set_output('release_url', release_url)
          set_output('reference_tag', reference_tag)
          set_output('pointer_branch', pointer_branch)
          if warnings:
              set_output('error_message', '; '.join(warnings))
          else:
              set_output('error_message', '')

          print('Publish flow completed successfully')
          PYTHON_SCRIPT

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 5f.2: Create post-release sync PR
  # ─────────────────────────────────────────────────────────────────────────────
  create-sync-pr:
    name: "Create Post-Release Sync PR"
    needs: [plan, publish-release]
    if: |
      needs.publish-release.outputs.success == 'true'
    runs-on: ubuntu-latest
    outputs:
      sync_pr_url: ${{ steps.sync.outputs.sync_pr_url }}
      sync_pr_number: ${{ steps.sync.outputs.sync_pr_number }}
      sync_status: ${{ steps.sync.outputs.sync_status }}
    steps:
      - name: Checkout API repo (main branch)
        uses: actions/checkout@v7
        with:
          path: api-repo
          fetch-depth: 1

      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Copy README release info from tag
        id: readme
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;

            // Read README from release tag
            let tagReadme;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'README.md',
                ref: tag
              });
              tagReadme = Buffer.from(data.content, 'base64').toString('utf8');
            } catch (e) {
              core.warning(`Could not read README.md from tag ${tag}: ${e.message}`);
              core.setOutput('changed', 'false');
              return;
            }

            const START = '<!-- CAMARA:RELEASE-INFO:START -->';
            const END = '<!-- CAMARA:RELEASE-INFO:END -->';

            // Extract release info block from tag README
            const tagStart = tagReadme.indexOf(START);
            const tagEnd = tagReadme.indexOf(END);
            if (tagStart === -1 || tagEnd === -1) {
              core.warning('Tag README missing release info delimiters');
              core.setOutput('changed', 'false');
              return;
            }
            const tagBlock = tagReadme.substring(tagStart, tagEnd + END.length);

            // Read local README (main branch checkout)
            const localPath = 'api-repo/README.md';
            if (!fs.existsSync(localPath)) {
              core.warning('README.md not found in API repo checkout');
              core.setOutput('changed', 'false');
              return;
            }
            const localReadme = fs.readFileSync(localPath, 'utf8');
            const localStart = localReadme.indexOf(START);
            const localEnd = localReadme.indexOf(END);
            if (localStart === -1 || localEnd === -1) {
              core.warning('Main README missing release info delimiters');
              core.setOutput('changed', 'false');
              return;
            }

            // Replace local block with tag block
            const newReadme = localReadme.substring(0, localStart) +
                              tagBlock +
                              localReadme.substring(localEnd + END.length);

            if (newReadme === localReadme) {
              console.log('README release info already up to date');
              core.setOutput('changed', 'false');
              return;
            }

            fs.writeFileSync(localPath, newReadme);
            core.setOutput('changed', 'true');
            console.log('README release info synced from tag');

      - name: Copy CHANGELOG from release tag
        id: changelog
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_TAG;

            // Build candidate paths: per-cycle first, then flat CHANGELOG.md
            // (flat covers legacy maintenance-release repos that have not yet
            // migrated to per-cycle layout; mirrors the publish-side fallback).
            const match = tag.match(/^r(\d+)\.\d+/);
            const candidates = [];
            if (match) candidates.push(`CHANGELOG/CHANGELOG-r${match[1]}.md`);
            candidates.push('CHANGELOG.md');

            let syncedPath = '';
            let content = '';
            for (const p of candidates) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: p,
                  ref: tag
                });
                content = Buffer.from(data.content, 'base64').toString('utf8');
                syncedPath = p;
                break;
              } catch (e) {
                // Try next candidate
              }
            }

            if (!syncedPath) {
              core.warning(`No CHANGELOG found at ${candidates.join(' or ')} on tag ${tag}`);
              core.setOutput('synced', 'false');
              return;
            }

            // Write to local api-repo checkout (mkdir parent for per-cycle case)
            const localPath = path.join('api-repo', syncedPath);
            fs.mkdirSync(path.dirname(localPath), { recursive: true });
            fs.writeFileSync(localPath, content);
            core.setOutput('synced', 'true');
            core.setOutput('changelog_path', syncedPath);
            console.log(`Synced ${syncedPath} from tag ${tag}`);

      - name: Resolve Bot Identity
        id: bot-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -n "${{ vars.RELEASE_APP_SLUG }}" ] && [ -n "${{ steps.app-token.outputs.token }}" ]; then
            BOT_LOGIN="${{ vars.RELEASE_APP_SLUG }}[bot]"
          else
            BOT_LOGIN="github-actions[bot]"
          fi
          BOT_INFO=$(gh api "/users/$BOT_LOGIN" --jq '{id: .id, login: .login}')
          BOT_NAME=$(echo "$BOT_INFO" | jq -r '.login')
          BOT_ID=$(echo "$BOT_INFO" | jq -r '.id')
          echo "bot_name=$BOT_NAME" >> $GITHUB_OUTPUT
          echo "bot_email=${BOT_ID}+${BOT_NAME}@users.noreply.github.com" >> $GITHUB_OUTPUT

      - name: Create sync PR
        id: sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          README_CHANGED: ${{ steps.readme.outputs.changed }}
          CHANGELOG_SYNCED: ${{ steps.changelog.outputs.synced }}
        run: |
          cd api-repo

          # Check if there are any changes to commit
          if [ "$README_CHANGED" != "true" ] && [ "$CHANGELOG_SYNCED" != "true" ]; then
            echo "::warning::No content changes to sync"
            echo "sync_status=no_changes" >> $GITHUB_OUTPUT
            echo "sync_pr_url=" >> $GITHUB_OUTPUT
            echo "sync_pr_number=" >> $GITHUB_OUTPUT
            exit 0
          fi

          SYNC_BRANCH="pr-to-main/${RELEASE_TAG}"

          # Create branch, stage, commit, push
          git checkout -b "$SYNC_BRANCH"
          git add -A
          git diff --cached --quiet && {
            echo "::warning::No actual file changes detected"
            echo "sync_status=no_changes" >> $GITHUB_OUTPUT
            echo "sync_pr_url=" >> $GITHUB_OUTPUT
            echo "sync_pr_number=" >> $GITHUB_OUTPUT
            exit 0
          }

          git config user.name "${{ steps.bot-identity.outputs.bot_name }}"
          git config user.email "${{ steps.bot-identity.outputs.bot_email }}"
          git commit -m "chore: post-release sync for ${RELEASE_TAG}"
          git push origin "$SYNC_BRANCH"

          # Create PR — capture failure as sync_status=failed.
          # Body assembled via heredoc so the markdown has no
          # YAML-run-block indent leaking into the rendered PR description.
          PR_BODY=$(cat <<EOF
          Automated post-release sync PR for ${RELEASE_TAG}.

          This PR updates:
          - README.md Release Information section (copied from release tag)
          - CHANGELOG for the release cycle

          Created by release automation workflow.
          EOF
          )
          if PR_URL=$(gh pr create \
            --title "Release Automation: Post-release sync (${RELEASE_TAG})" \
            --body "$PR_BODY" \
            --head "$SYNC_BRANCH" \
            --base main); then

            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')

            # Add labels
            gh pr edit "$PR_NUMBER" --add-label "post-release" --add-label "automated" 2>/dev/null || true

            echo "sync_pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "sync_pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "sync_status=created" >> $GITHUB_OUTPUT
            echo "Sync PR created: $PR_URL"
          else
            echo "::error::Failed to create post-release sync PR"
            echo "sync_status=failed" >> $GITHUB_OUTPUT
            echo "sync_pr_url=" >> $GITHUB_OUTPUT
            echo "sync_pr_number=" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 5g: Handle PR merge (draft release creation)
  # ─────────────────────────────────────────────────────────────────────────────
  handle-pr-merge:
    needs: [plan]
    # Runs on a config error too (the plan job then fails on purpose), as it
    # did when a separate job reported the config error.
    if: |
      !cancelled() &&
      needs.plan.outputs.trigger_type == 'pr_merge' &&
      (needs.plan.result == 'success' || needs.plan.outputs.config_error != '')
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.create-draft.outputs.success }}
      draft_release_url: ${{ steps.create-draft.outputs.draft_release_url }}
      error_message: ${{ steps.create-draft.outputs.error_message }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Extract CHANGELOG release notes
        id: changelog
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const snapshotBranch = '${{ needs.plan.outputs.snapshot_branch }}';
            const releaseTag = '${{ needs.plan.outputs.release_tag }}';

            // Derive meta-release from tag: r4.1 → r4, r3.2 → r3
            const metaRelease = releaseTag.match(/^(r\d+)/)?.[1] || '';

            // Try CHANGELOG/CHANGELOG-rX.md first (new convention), fall back to CHANGELOG.md
            const candidates = [];
            if (metaRelease) {
              candidates.push(`CHANGELOG/CHANGELOG-${metaRelease}.md`);
            }
            candidates.push('CHANGELOG.md');

            let changelogContent = '';
            let changelogPath = '';
            let changelogSha = '';
            for (const path of candidates) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: path,
                  ref: snapshotBranch
                });
                changelogContent = Buffer.from(response.data.content, 'base64').toString('utf-8');
                changelogPath = path;
                changelogSha = response.data.sha;
                console.log(`Fetched ${path} (${changelogContent.length} chars)`);
                break;
              } catch (error) {
                console.log(`${path} not found, trying next...`);
              }
            }

            if (!changelogContent) {
              console.log('::warning::No CHANGELOG file found on snapshot branch');
              core.setOutput('release_notes', '');
              core.setOutput('candidate_block_stripped', '');
              return;
            }

            // --- Strip AUTOGENERATED:CANDIDATE_CHANGES block if present ---
            const START_MARKER = '<!-- BEGIN:AUTOGENERATED:CANDIDATE_CHANGES -->';
            const END_MARKER = '<!-- END:AUTOGENERATED:CANDIDATE_CHANGES -->';

            const startPos = changelogContent.indexOf(START_MARKER);
            const endPos = changelogContent.indexOf(END_MARKER);
            let candidateBlockStripped = false;

            if (startPos !== -1 && endPos !== -1 && endPos > startPos) {
              // Both markers present — strip the entire block (inclusive)
              changelogContent = (
                changelogContent.substring(0, startPos) +
                changelogContent.substring(endPos + END_MARKER.length)
              ).replace(/\n{3,}/g, '\n\n');
              candidateBlockStripped = true;
              console.log('Stripped full candidate changes block');
            } else if (startPos !== -1 || endPos !== -1) {
              // Orphan marker — codeowner partially deleted the block.
              // Strip just the orphan marker line (HTML comment, always safe to remove).
              const orphanMarker = startPos !== -1 ? START_MARKER : END_MARKER;
              changelogContent = changelogContent
                .split('\n')
                .filter(line => line.trim() !== orphanMarker)
                .join('\n');
              candidateBlockStripped = true;
              console.log(`Stripped orphan marker: ${orphanMarker}`);
            }
            // If neither marker found: codeowner already removed the block — no action needed

            if (candidateBlockStripped) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: changelogPath,
                message: 'chore: auto-remove candidate changes block from CHANGELOG',
                content: Buffer.from(changelogContent).toString('base64'),
                sha: changelogSha,
                branch: snapshotBranch
              });
              console.log(`Committed cleaned CHANGELOG to ${snapshotBranch}`);
            }

            core.setOutput('candidate_block_stripped', candidateBlockStripped ? 'true' : '');

            // Extract section from "## Release Notes" to next "# rX.Y" heading or EOF
            const lines = changelogContent.split('\n');
            let startIdx = -1;
            let endIdx = lines.length;

            // Find "## Release Notes" line
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].match(/^## Release Notes/i)) {
                startIdx = i;
                break;
              }
            }

            if (startIdx === -1) {
              console.log(`::warning::No "## Release Notes" section found in ${changelogPath}`);
              core.setOutput('release_notes', '');
              return;
            }

            // Find end: next "# rX.Y" heading (top-level release heading)
            for (let i = startIdx + 1; i < lines.length; i++) {
              if (lines[i].match(/^# r\d+/)) {
                endIdx = i;
                break;
              }
            }

            // Trim trailing blank lines
            while (endIdx > startIdx && lines[endIdx - 1].trim() === '') {
              endIdx--;
            }

            const releaseNotes = lines.slice(startIdx, endIdx).join('\n');
            console.log(`Extracted release notes: ${releaseNotes.length} chars (lines ${startIdx + 1}-${endIdx})`);

            // Write to output using delimiter for multiline
            const outputFile = process.env.GITHUB_OUTPUT;
            const fs = require('fs');
            const delimiter = 'RELEASE_NOTES_EOF';
            fs.appendFileSync(outputFile, `release_notes<<${delimiter}\n${releaseNotes}\n${delimiter}\n`);

      - name: Create Draft Release
        id: create-draft
        uses: actions/github-script@v9
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const releaseTag = '${{ needs.plan.outputs.release_tag }}';
            const snapshotBranch = '${{ needs.plan.outputs.snapshot_branch }}';
            const releaseType = '${{ needs.plan.outputs.release_type }}';
            const releaseNotes = process.env.RELEASE_NOTES || '';

            console.log(`Creating draft release for ${releaseTag}`);
            console.log(`  Snapshot branch: ${snapshotBranch}`);
            console.log(`  Release type: ${releaseType}`);

            try {
              // Determine if this is a pre-release
              const isPrerelease = releaseType.startsWith('pre-release');

              // Build release body from CHANGELOG content or fallback
              let body = '';
              if (releaseNotes) {
                body = releaseNotes;
              } else {
                body = `## Release ${releaseTag}\n\n`;
                body += `**Release type:** ${releaseType}\n\n`;
                body += `---\n\n`;
                body += `_CHANGELOG.md content was not available — please add release notes manually._\n`;
              }

              // Create draft release
              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: releaseTag,
                target_commitish: snapshotBranch,
                name: releaseTag,
                body: body,
                draft: true,
                prerelease: isPrerelease
              });

              console.log(`Draft release created: ${release.data.html_url}`);
              core.setOutput('success', 'true');
              core.setOutput('draft_release_url', release.data.html_url);
              core.setOutput('error_message', '');
            } catch (error) {
              console.log(`::error::Draft release creation failed: ${error.message}`);
              core.setOutput('success', 'false');
              core.setOutput('draft_release_url', '');
              core.setOutput('error_message', error.message);
            }

      # release_date is set during /publish-release (finalize_metadata), not at draft creation

      - name: Checkout tooling for bot comment
        if: steps.create-draft.outputs.success == 'true' && needs.plan.outputs.release_issue_number != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Post draft_created comment
        if: steps.create-draft.outputs.success == 'true' && needs.plan.outputs.release_issue_number != ''
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          issue_number: ${{ needs.plan.outputs.release_issue_number }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          run_id: ${{ github.run_id }}
          template: draft_created
          base_context: ${{ needs.plan.outputs.base_context }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          context: |
            {
              "draft_release_url": "${{ steps.create-draft.outputs.draft_release_url }}",
              "release_pr_number": "${{ github.event.pull_request.number }}",
              "release_pr_url": "${{ github.event.pull_request.html_url }}",
              "candidate_block_stripped": "${{ steps.changelog.outputs.candidate_block_stripped }}"
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 5f: Handle issue close/reopen events
  # ─────────────────────────────────────────────────────────────────────────────
  handle-issue-event:
    needs: [plan]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.config_error == '' &&
      (needs.plan.outputs.trigger_type == 'issue_close' ||
      needs.plan.outputs.trigger_type == 'issue_reopen')
    runs-on: ubuntu-latest
    outputs:
      action_taken: ${{ steps.handle.outputs.action_taken }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Handle Issue Event
        id: handle
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const triggerType = '${{ needs.plan.outputs.trigger_type }}';
            const currentState = '${{ needs.plan.outputs.state }}';
            const issueNumber = parseInt('${{ needs.plan.outputs.issue_number }}');

            console.log(`Handling ${triggerType} event`);
            console.log(`Current state: ${currentState}`);

            // States that block issue closure
            const blockClosureStates = ['snapshot-active', 'draft-ready'];

            if (triggerType === 'issue_close') {
              // Check if we need to auto-reopen
              if (blockClosureStates.includes(currentState)) {
                console.log(`Auto-reopening issue - cannot close in state '${currentState}'`);

                // Reopen the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'open'
                });

                core.setOutput('action_taken', 'reopened');
                console.log('Issue reopened successfully');
              } else {
                console.log(`Issue closure allowed in state '${currentState}'`);
                core.setOutput('action_taken', 'allowed_close');
              }
            } else if (triggerType === 'issue_reopen') {
              // Just log for now - no special handling needed
              console.log('Issue was reopened');
              core.setOutput('action_taken', 'noted_reopen');
            }

      - name: Post Auto-Reopen Comment
        if: steps.handle.outputs.action_taken == 'reopened'
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          issue_number: ${{ needs.plan.outputs.issue_number }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          run_id: ${{ github.run_id }}
          template: issue_reopened
          base_context: ${{ needs.plan.outputs.base_context }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          context: |
            {
              "reason": "Cannot close Release Issue while release is in progress"
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 6: Update Release Issue state (after command execution)
  # ─────────────────────────────────────────────────────────────────────────────
  update-issue:
    name: "sync-issue"
    needs:
      [
        plan,
        create-snapshot,
        discard-snapshot,
        delete-draft,
        handle-pr-merge,
        handle-issue-event,
      ]
    if: |
      always() &&
      needs.plan.outputs.config_error == '' &&
      needs.plan.outputs.state != '' &&
      (
        (needs.create-snapshot.result == 'success' && needs.create-snapshot.outputs.success == 'true') ||
        (needs.discard-snapshot.result == 'success' && needs.discard-snapshot.outputs.success == 'true') ||
        (needs.delete-draft.result == 'success' && needs.delete-draft.outputs.success == 'true') ||
        (needs.handle-pr-merge.result == 'success' && needs.handle-pr-merge.outputs.success == 'true') ||
        (needs.handle-issue-event.result == 'success') ||
        (needs.plan.outputs.command == 'sync-issue')
      )
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.sync.outputs.issue_number }}
      issue_action: ${{ steps.sync.outputs.issue_action }}
      issue_url: ${{ steps.sync.outputs.issue_url }}
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      # ── Common file cache sync ─────────────────────────────────────────
      # When cache is stale, fetch Commonalities files and create/update a
      # sync PR before the Release Issue update. Uses continue-on-error so
      # sync failures don't prevent the issue update.

      - name: Checkout API repo (for common sync)
        id: sync-checkout-api
        if: needs.plan.outputs.common_cache_status == 'stale'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          path: _api_repo
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Checkout Commonalities at declared tag (sparse)
        id: sync-checkout-commonalities
        if: steps.sync-checkout-api.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: camaraproject/Commonalities
          ref: ${{ needs.plan.outputs.commonalities_release }}
          path: _commonalities
          sparse-checkout: artifacts/common
          sparse-checkout-cone-mode: true

      - name: Copy Commonalities files and write manifest
        id: sync-common
        if: steps.sync-checkout-commonalities.outcome == 'success'
        continue-on-error: true
        env:
          COMMONALITIES_RELEASE: ${{ needs.plan.outputs.commonalities_release }}
          TOOLING_PATH: ${{ github.workspace }}/_tooling
        shell: python
        run: |
          import os, shutil, sys
          from pathlib import Path

          sys.path.insert(0, os.environ['TOOLING_PATH'])

          comm_release = os.environ['COMMONALITIES_RELEASE']
          source_dir = Path('_commonalities/artifacts/common')
          api_repo = Path('_api_repo')
          common_dir = api_repo / 'code' / 'common'
          common_dir.mkdir(parents=True, exist_ok=True)
          output_file = os.environ['GITHUB_OUTPUT']

          if not source_dir.is_dir():
              print(f"::error::Commonalities artifacts/common not found at tag {comm_release}")
              with open(output_file, 'a') as f:
                  f.write("synced=false\n")
              sys.exit(0)

          # Copy YAML files from Commonalities checkout to code/common/
          from tooling_lib.cache_sync import git_blob_sha

          source_files = sorted(p for p in source_dir.iterdir() if p.suffix == '.yaml')
          if not source_files:
              print(f"::error::No YAML files in Commonalities artifacts/common at {comm_release}")
              with open(output_file, 'a') as f:
                  f.write("synced=false\n")
              sys.exit(0)

          manifest_files = {}
          for src_path in source_files:
              dest = common_dir / src_path.name
              shutil.copy2(src_path, dest)
              raw_bytes = dest.read_bytes()
              sha = git_blob_sha(raw_bytes)
              manifest_files[src_path.name] = sha
              print(f"Synced: {src_path.name} ({sha[:12]})")

          # Write .sync-manifest.yaml per sync-manifest-schema.yaml
          import yaml

          manifest = {
              'sources': [{
                  'repository': 'Commonalities',
                  'release': comm_release,
                  'files': manifest_files,
              }]
          }
          manifest_path = common_dir / '.sync-manifest.yaml'
          manifest_path.write_text(
              yaml.dump(manifest, default_flow_style=False, sort_keys=False),
              encoding='utf-8'
          )
          print(f"Wrote manifest: {manifest_path} ({len(manifest_files)} files)")

          with open(output_file, 'a') as f:
              f.write("synced=true\n")
              f.write(f"files_count={len(manifest_files)}\n")

      - name: Resolve Bot Identity (for common sync)
        id: sync-bot-identity
        if: needs.plan.outputs.common_cache_status == 'stale' && steps.sync-common.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -n "${{ vars.RELEASE_APP_SLUG }}" ] && [ -n "${{ steps.app-token.outputs.token }}" ]; then
            BOT_LOGIN="${{ vars.RELEASE_APP_SLUG }}[bot]"
          else
            BOT_LOGIN="github-actions[bot]"
          fi
          BOT_INFO=$(gh api "/users/$BOT_LOGIN" --jq '{id: .id, login: .login}')
          BOT_NAME=$(echo "$BOT_INFO" | jq -r '.login')
          BOT_ID=$(echo "$BOT_INFO" | jq -r '.id')
          echo "bot_name=$BOT_NAME" >> $GITHUB_OUTPUT
          echo "bot_email=${BOT_ID}+${BOT_NAME}@users.noreply.github.com" >> $GITHUB_OUTPUT

      - name: Create or update common sync PR
        id: sync-pr
        if: needs.plan.outputs.common_cache_status == 'stale' && steps.sync-common.outputs.synced == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          COMMONALITIES_RELEASE: ${{ needs.plan.outputs.commonalities_release }}
        run: |
          cd _api_repo

          SYNC_BRANCH="sync-common/${COMMONALITIES_RELEASE}"

          # Close stale sync PRs (different commonalities release)
          STALE_PRS=$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync-common/")) | select(.headRefName != "'"$SYNC_BRANCH"'") | .number' 2>/dev/null || true)
          for pr_num in $STALE_PRS; do
            echo "Closing stale sync PR #$pr_num"
            gh pr close "$pr_num" --comment "Superseded by sync to Commonalities ${COMMONALITIES_RELEASE}" || true
          done

          git config user.name "${{ steps.sync-bot-identity.outputs.bot_name }}"
          git config user.email "${{ steps.sync-bot-identity.outputs.bot_email }}"

          # Release Automation owns the sync-common branch: rebuild it from the
          # current main HEAD on every run (dependabot model), carrying the
          # freshly-synced code/common content already staged in the working tree.
          # -B resets the branch ref at HEAD and keeps those working-tree changes,
          # avoiding the overwrite abort that a plain checkout of an existing
          # branch hits against the already-modified files.
          git checkout -B "$SYNC_BRANCH"

          git add code/common/
          if git diff --cached --quiet; then
            echo "code/common already matches Commonalities ${COMMONALITIES_RELEASE}; nothing to sync"
            echo "sync_pr_url=" >> $GITHUB_OUTPUT
            echo "sync_pr_number=" >> $GITHUB_OUTPUT
            echo "sync_status=no_changes" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore: sync common files from Commonalities ${COMMONALITIES_RELEASE}"

          # Force-push: the branch is reset to main HEAD each run, so it is not a
          # fast-forward of any pre-existing remote branch. RA is the sole owner.
          git push --force origin "$SYNC_BRANCH"

          # Ensure exactly one open sync PR. The branch may have pre-existed with
          # its PR already closed (e.g. a codeowner closed it but left the branch),
          # so reuse an open PR if present, otherwise (re)create one.
          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --state open --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "Reusing open sync PR: $EXISTING_PR"
            echo "sync_pr_url=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "sync_pr_number=$(echo "$EXISTING_PR" | grep -oE '[0-9]+$')" >> $GITHUB_OUTPUT
            echo "sync_status=updated" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Create PR. Body assembled via heredoc so markdown has no
          # YAML-run-block indent leaking into the rendered PR description.
          PR_BODY=$(cat <<EOF
          > [!WARNING]
          > This branch is owned by Release Automation and is rebuilt from \`main\` on every run.
          > **Do not commit fixes to this branch** — any commits here are overwritten the next time the sync runs.

          Automated sync of \`code/common/\` files from \`camaraproject/Commonalities\` at release tag \`${COMMONALITIES_RELEASE}\`.

          This PR was created by release automation because the cached Commonalities files were out of sync with the declared dependency in \`release-plan.yaml\`.

          **What changed:**
          - Updated files in \`code/common/\` to match Commonalities ${COMMONALITIES_RELEASE}
          - Added/updated \`.sync-manifest.yaml\` with file integrity hashes

          **How to handle this PR:**
          - **Validation green** — review and merge.
          - **Validation red** — choose one:
            - *(recommended)* fix the errors on \`main\`, then re-trigger the sync; this PR is rebuilt from the new \`main\` HEAD with the corrected content.
            - merge this PR with the errors and fix them on \`main\` afterwards.

          To re-trigger the sync, run the **CAMARA Release Automation** workflow from the repository's **Actions** tab.

          \`/create-snapshot\` is blocked until common files are in sync.
          EOF
          )
          PR_URL=$(gh pr create \
            --title "Sync common files from Commonalities ${COMMONALITIES_RELEASE}" \
            --body "$PR_BODY" \
            --head "$SYNC_BRANCH" \
            --base main) || {
            echo "::error::Failed to create sync PR"
            echo "sync_status=failed" >> $GITHUB_OUTPUT
            exit 0
          }

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          gh pr edit "$PR_NUMBER" --add-label "common-sync" --add-label "automated" 2>/dev/null || true

          echo "sync_pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "sync_pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "sync_status=created" >> $GITHUB_OUTPUT
          echo "Sync PR created: $PR_URL"

      # ── End common file cache sync ────────────────────────────────────────

      - name: Resolve Sync Context
        id: sync-context
        shell: bash
        run: |
          state_override=""
          snapshot_branch_override=""
          release_pr_number_override=""
          draft_release_url_override=""
          force_update="false"

          if [ "${{ needs.create-snapshot.result }}" = "success" ] && [ "${{ needs.create-snapshot.outputs.success }}" = "true" ]; then
            state_override="snapshot-active"
            snapshot_branch_override="${{ needs.create-snapshot.outputs.snapshot_branch }}"
            release_pr_number_override="${{ needs.create-snapshot.outputs.release_pr_number }}"
            force_update="true"
          elif [ "${{ needs.handle-pr-merge.result }}" = "success" ] && [ "${{ needs.handle-pr-merge.outputs.success }}" = "true" ]; then
            state_override="draft-ready"
            snapshot_branch_override="${{ needs.plan.outputs.snapshot_branch }}"
            release_pr_number_override="${{ github.event.pull_request.number }}"
            draft_release_url_override="${{ needs.handle-pr-merge.outputs.draft_release_url }}"
            force_update="true"
          elif [ "${{ needs.discard-snapshot.result }}" = "success" ] && [ "${{ needs.discard-snapshot.outputs.success }}" = "true" ]; then
            state_override="planned"
            force_update="true"
          elif [ "${{ needs.delete-draft.result }}" = "success" ] && [ "${{ needs.delete-draft.outputs.success }}" = "true" ]; then
            state_override="planned"
            force_update="true"
          elif [ "${{ needs.plan.outputs.command }}" = "sync-issue" ]; then
            force_update="true"
          fi

          {
            echo "state_override=$state_override"
            echo "snapshot_branch_override=$snapshot_branch_override"
            echo "release_pr_number_override=$release_pr_number_override"
            echo "draft_release_url_override=$draft_release_url_override"
            echo "force_update=$force_update"
          } >> "$GITHUB_OUTPUT"

      - name: Sync Release Issue
        id: sync
        uses: ./_tooling/shared-actions/sync-release-issue
        with:
          release_tag: ${{ needs.plan.outputs.release_tag }}
          state: ${{ needs.plan.outputs.state }}
          snapshot_branch: ${{ needs.plan.outputs.snapshot_branch }}
          release_pr_number: ${{ needs.plan.outputs.release_pr_number }}
          state_override: ${{ steps.sync-context.outputs.state_override }}
          snapshot_branch_override: ${{ steps.sync-context.outputs.snapshot_branch_override }}
          release_pr_number_override: ${{ steps.sync-context.outputs.release_pr_number_override }}
          draft_release_url_override: ${{ steps.sync-context.outputs.draft_release_url_override }}
          force_update: ${{ steps.sync-context.outputs.force_update }}
          trigger_type: ${{ needs.plan.outputs.trigger_type }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          common_cache_status: ${{ needs.plan.outputs.common_cache_status }}
          common_cache_details: ${{ needs.plan.outputs.common_cache_details }}
          common_sync_pr_url: ${{ steps.sync-pr.outputs.sync_pr_url || needs.plan.outputs.common_sync_pr_url }}

      - name: Log Result
        run: |
          echo "Issue sync result:"
          echo "  Action: ${{ steps.sync.outputs.issue_action }}"
          echo "  Issue: #${{ steps.sync.outputs.issue_number }}"
          echo "  URL: ${{ steps.sync.outputs.issue_url }}"

      - name: Post Not-Planned Notification
        if: |
          steps.sync.outputs.issue_action == 'updated' &&
          needs.plan.outputs.state == 'not_planned' &&
          steps.sync.outputs.issue_number != ''
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          issue_number: ${{ steps.sync.outputs.issue_number }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          run_id: ${{ github.run_id }}
          template: state_not_planned
          base_context: ${{ needs.plan.outputs.base_context }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          context: |
            {
              "state": "not-planned"
            }

      - name: Post Issue Created Notification
        if: |
          steps.sync.outputs.issue_action == 'created' &&
          steps.sync.outputs.issue_number != ''
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          issue_number: ${{ steps.sync.outputs.issue_number }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          run_id: ${{ github.run_id }}
          template: issue_created
          base_context: ${{ needs.plan.outputs.base_context }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          context: |
            {
              "state": "planned",
              "trigger_type": "${{ needs.plan.outputs.trigger_type }}",
              "release_plan_url": "${{ github.server_url }}/${{ github.repository }}/blob/main/release-plan.yaml",
              "closed_issue_number": "${{ github.event.issue.number }}",
              "closed_issue_url": "${{ github.event.issue.html_url }}"
            }

      - name: Post Common Sync PR Created
        if: |
          steps.sync-pr.outputs.sync_status == 'created' &&
          (needs.plan.outputs.release_issue_number != '' || steps.sync.outputs.issue_number != '')
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          issue_number: ${{ needs.plan.outputs.release_issue_number || steps.sync.outputs.issue_number }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          run_id: ${{ github.run_id }}
          template: common_sync_pr_created
          base_context: ${{ needs.plan.outputs.base_context }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          context: |
            {
              "common_cache_details": "${{ needs.plan.outputs.common_cache_details }}",
              "common_sync_pr_url": "${{ steps.sync-pr.outputs.sync_pr_url }}"
            }

      - name: Post Common Sync Failed
        if: |
          steps.sync-checkout-commonalities.outcome == 'failure' &&
          (needs.plan.outputs.release_issue_number != '' || steps.sync.outputs.issue_number != '')
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          issue_number: ${{ needs.plan.outputs.release_issue_number || steps.sync.outputs.issue_number }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          run_id: ${{ github.run_id }}
          template: common_sync_failed
          base_context: ${{ needs.plan.outputs.base_context }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          context: '{}'

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 7: Post final result comment
  # ─────────────────────────────────────────────────────────────────────────────
  post-result:
    needs:
      [
        plan,
        create-snapshot,
        discard-snapshot,
        delete-draft,
        publish-release,
        create-sync-pr,
      ]
    if: |
      always() &&
      needs.plan.outputs.trigger_type == 'slash_command' &&
      needs.plan.outputs.allowed == 'true' &&
      needs.plan.outputs.interim_posted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _tooling
          sparse-checkout: |
            release_automation
            shared-actions
            tooling_lib
            validation
            linting/config

      - name: Determine Result Template
        id: template
        run: |
          COMMAND="${{ needs.plan.outputs.command }}"

          # Map command to success/failure templates
          case "$COMMAND" in
            create-snapshot)
              if [ "${{ needs.create-snapshot.outputs.success }}" == "true" ]; then
                echo "template=snapshot_created" >> $GITHUB_OUTPUT
              else
                echo "template=snapshot_failed" >> $GITHUB_OUTPUT
              fi
              ;;
            discard-snapshot)
              if [ "${{ needs.discard-snapshot.outputs.success }}" == "true" ]; then
                echo "template=snapshot_discarded" >> $GITHUB_OUTPUT
              else
                echo "template=snapshot_failed" >> $GITHUB_OUTPUT
              fi
              ;;
            delete-draft)
              if [ "${{ needs.delete-draft.outputs.success }}" == "true" ]; then
                echo "template=draft_revoked" >> $GITHUB_OUTPUT
              else
                echo "template=snapshot_failed" >> $GITHUB_OUTPUT
              fi
              ;;
            sync-issue)
              echo "template=interim_processing" >> $GITHUB_OUTPUT
              ;;
            publish-release)
              if [ "${{ needs.publish-release.outputs.success }}" == "true" ]; then
                echo "template=release_published" >> $GITHUB_OUTPUT
              else
                echo "template=publish_failed" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              # No handler matched - this is a workflow bug
              echo "template=internal_error" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Resolve Reason
        id: reason
        env:
          COMMAND: ${{ needs.plan.outputs.command }}
          COMMAND_ARGS: ${{ needs.plan.outputs.command_args }}
        run: |
          # Pass user-supplied reason text via env (not via GitHub Actions
          # expression interpolation) so backticks, $(), and other shell
          # metacharacters in slash-command arguments are treated as opaque
          # text, not expanded by bash.
          ARGS="$COMMAND_ARGS"

          # Default reason for discard/delete commands when none provided
          if [ -z "$ARGS" ] && { [ "$COMMAND" = "discard-snapshot" ] || [ "$COMMAND" = "delete-draft" ]; }; then
            ARGS="No reason provided"
          fi

          echo "reason=$ARGS" >> $GITHUB_OUTPUT

      - name: Build Result Context
        id: context
        env:
          REASON: ${{ steps.reason.outputs.reason }}
        run: |
          # Build delta context — pass REASON via env to avoid shell-interpolating
          # user-supplied text (same rationale as Resolve Reason above).
          CONTEXT=$(jq -n \
            --arg reason "$REASON" \
            '{
              reason: $reason
            }')

          # Override release_review_branch with renamed name for discard/delete
          if [ "${{ needs.discard-snapshot.outputs.success }}" == "true" ]; then
            RRB="${{ needs.discard-snapshot.outputs.renamed_review_branch }}"
            if [ -n "$RRB" ]; then
              RRB_URL="${{ github.server_url }}/${{ github.repository }}/tree/${RRB}"
              CONTEXT=$(echo "$CONTEXT" | jq \
                --arg rrb "$RRB" \
                --arg rrb_url "$RRB_URL" \
                '. + {release_review_branch: $rrb, release_review_branch_url: $rrb_url}')
            fi
          fi

          if [ "${{ needs.delete-draft.outputs.success }}" == "true" ]; then
            RRB="${{ needs.delete-draft.outputs.renamed_review_branch }}"
            if [ -n "$RRB" ]; then
              RRB_URL="${{ github.server_url }}/${{ github.repository }}/tree/${RRB}"
              CONTEXT=$(echo "$CONTEXT" | jq \
                --arg rrb "$RRB" \
                --arg rrb_url "$RRB_URL" \
                '. + {release_review_branch: $rrb, release_review_branch_url: $rrb_url}')
            fi
          fi

          # Add create-snapshot outputs if that job ran successfully
          if [ "${{ needs.create-snapshot.outputs.success }}" == "true" ]; then
            # Use env var for apis_json to avoid shell quote issues with embedded JSON
            CREATE_APIS_JSON='${{ needs.create-snapshot.outputs.apis_json }}'
            # Construct branch URLs
            SB="${{ needs.create-snapshot.outputs.snapshot_branch }}"
            RRB="${{ needs.create-snapshot.outputs.release_review_branch }}"
            SB_URL="${{ github.server_url }}/${{ github.repository }}/tree/${SB}"
            RRB_URL="${{ github.server_url }}/${{ github.repository }}/tree/${RRB}"
            CONTEXT=$(echo "$CONTEXT" | jq \
              --arg sid "${{ needs.create-snapshot.outputs.snapshot_id }}" \
              --arg sb "$SB" \
              --arg sb_url "$SB_URL" \
              --arg rrb "$RRB" \
              --arg rrb_url "$RRB_URL" \
              --arg prn "${{ needs.create-snapshot.outputs.release_pr_number }}" \
              --arg pru "${{ needs.create-snapshot.outputs.release_pr_url }}" \
              --arg apis "$CREATE_APIS_JSON" \
              '. + {snapshot_id: $sid, snapshot_branch: $sb, snapshot_branch_url: $sb_url, release_review_branch: $rrb, release_review_branch_url: $rrb_url, release_pr_number: $prn, release_pr_url: $pru, apis_json: $apis}')
          fi

          # Add publish-release outputs if that job ran
          if [ "${{ needs.publish-release.outputs.success }}" == "true" ]; then
            # Construct reference tag URL
            REF_TAG="${{ needs.publish-release.outputs.reference_tag }}"
            REF_TAG_URL=""
            if [ -n "$REF_TAG" ]; then
              REF_TAG_URL="${{ github.server_url }}/${{ github.repository }}/tree/${REF_TAG}"
            fi
            # Get short SHA for display
            SRC_SHA="${{ needs.plan.outputs.src_commit_sha }}"
            SRC_SHA_SHORT="${SRC_SHA:0:7}"
            CONTEXT=$(echo "$CONTEXT" | jq \
              --arg release_url "${{ needs.publish-release.outputs.release_url }}" \
              --arg reference_tag "$REF_TAG" \
              --arg reference_tag_url "$REF_TAG_URL" \
              --arg sync_pr_url "${{ needs.create-sync-pr.outputs.sync_pr_url }}" \
              --arg sync_pr_number "${{ needs.create-sync-pr.outputs.sync_pr_number }}" \
              --arg src_commit_sha_short "$SRC_SHA_SHORT" \
              '. + {release_url: $release_url, reference_tag: $reference_tag, reference_tag_url: $reference_tag_url, sync_pr_url: $sync_pr_url, sync_pr_number: $sync_pr_number, src_commit_sha_short: $src_commit_sha_short}')

            # Collect post-publish warnings (ref tag, pointer branch, cleanup, sync PR)
            PUBLISH_WARNINGS=""

            # Warnings from publish job (non-critical steps 2-4)
            PUBLISH_ERR="${{ needs.publish-release.outputs.error_message }}"
            if [ -n "$PUBLISH_ERR" ]; then
              PUBLISH_WARNINGS="$PUBLISH_ERR"
            fi

            # Warning for sync PR anomaly (differentiated by status)
            SYNC_STATUS="${{ needs.create-sync-pr.outputs.sync_status }}"
            SYNC_WARNING=""
            if [ "$SYNC_STATUS" = "failed" ]; then
              SYNC_WARNING="Post-release sync PR creation failed — create manually"
            elif [ "$SYNC_STATUS" = "no_changes" ]; then
              SYNC_WARNING="Post-release sync skipped (no changes detected) — verify README/CHANGELOG"
            elif [ "$SYNC_STATUS" != "created" ]; then
              SYNC_WARNING="Post-release sync status unknown — verify README/CHANGELOG"
            fi
            if [ -n "$SYNC_WARNING" ]; then
              if [ -n "$PUBLISH_WARNINGS" ]; then
                PUBLISH_WARNINGS="$PUBLISH_WARNINGS; $SYNC_WARNING"
              else
                PUBLISH_WARNINGS="$SYNC_WARNING"
              fi
            fi

            if [ -n "$PUBLISH_WARNINGS" ]; then
              CONTEXT=$(echo "$CONTEXT" | jq \
                --arg pw "$PUBLISH_WARNINGS" \
                '. + {publish_warnings: $pw}')
            fi
          fi

          # Add error message for command failure cases
          if [ "${{ needs.create-snapshot.outputs.success }}" == "false" ]; then
            CONTEXT=$(echo "$CONTEXT" | jq \
              --arg err "${{ needs.create-snapshot.outputs.error_message }}" \
              '. + {error_message: $err}')
          elif [ "${{ needs.discard-snapshot.outputs.success }}" == "false" ]; then
            CONTEXT=$(echo "$CONTEXT" | jq \
              --arg err "${{ needs.discard-snapshot.outputs.error_message }}" \
              '. + {error_message: $err}')
          elif [ "${{ needs.delete-draft.outputs.success }}" == "false" ]; then
            CONTEXT=$(echo "$CONTEXT" | jq \
              --arg err "${{ needs.delete-draft.outputs.error_message }}" \
              '. + {error_message: $err}')
          elif [ "${{ needs.publish-release.outputs.success }}" == "false" ]; then
            CONTEXT=$(echo "$CONTEXT" | jq \
              --arg err "${{ needs.publish-release.outputs.error_message }}" \
              '. + {error_message: $err}')
          fi



          echo "context<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Result Comment
        uses: ./_tooling/shared-actions/post-bot-comment
        with:
          issue_number: ${{ needs.plan.outputs.issue_number }}
          release_tag: ${{ needs.plan.outputs.release_tag }}
          run_id: ${{ github.run_id }}
          template: ${{ steps.template.outputs.template }}
          # Use base_context + delta
          base_context: ${{ needs.plan.outputs.base_context }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          context: ${{ steps.context.outputs.context }}
          comment_id: ${{ needs.plan.outputs.comment_id }}

      # Update issue state and conditionally close (not in publish-release job)
      - name: Update and Close Release Issue
        if: |
          needs.publish-release.outputs.success == 'true' &&
          needs.plan.outputs.release_issue_number != ''
        env:
          ISSUE_NUMBER: ${{ needs.plan.outputs.release_issue_number }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_URL: ${{ needs.publish-release.outputs.release_url }}
          REFERENCE_TAG: ${{ needs.publish-release.outputs.reference_tag }}
          SYNC_PR_URL: ${{ needs.create-sync-pr.outputs.sync_pr_url }}
          PUBLISH_WARNINGS: ${{ needs.publish-release.outputs.error_message }}
          SYNC_STATUS: ${{ needs.create-sync-pr.outputs.sync_status }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const releaseTag = process.env.RELEASE_TAG;
            const releaseUrl = process.env.RELEASE_URL;
            const referenceTag = process.env.REFERENCE_TAG;
            const syncPrUrl = process.env.SYNC_PR_URL;
            const publishWarnings = process.env.PUBLISH_WARNINGS;
            const syncStatus = process.env.SYNC_STATUS;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            console.log(`Updating release issue #${issueNumber} after publish (sync status: ${syncStatus})`);

            try {
              // Get current issue
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              let body = issue.body || '';

              // Build STATE section content
              let stateLines = [];
              stateLines.push('**State:** `published`');
              stateLines.push('');
              stateLines.push(`✅ **Release published:** [${releaseTag}](${releaseUrl})`);
              stateLines.push(`📌 **Reference tag:** [\`${referenceTag}\`](${repoUrl}/tree/${referenceTag})`);
              if (syncPrUrl) {
                stateLines.push(`🔄 **Sync PR:** [View PR](${syncPrUrl})`);
              }

              // Collect warnings from non-critical post-publish steps
              let warnings = [];
              if (publishWarnings) {
                warnings.push(publishWarnings);
              }
              if (syncStatus === 'failed') {
                warnings.push('Post-release sync PR creation failed — create manually');
              } else if (syncStatus === 'no_changes') {
                warnings.push('Post-release sync skipped (no changes detected) — verify README/CHANGELOG');
              } else if (syncStatus !== 'created') {
                warnings.push('Post-release sync status unknown — verify README/CHANGELOG');
              }
              if (warnings.length > 0) {
                stateLines.push(`⚠️ **Warnings:** ${warnings.join('; ')}`);
              }
              const stateContent = stateLines.join('\n');

              // Replace STATE section
              const stateStartMarker = '<!-- BEGIN:STATE -->';
              const stateEndMarker = '<!-- END:STATE -->';
              const stateStartIdx = body.indexOf(stateStartMarker);
              const stateEndIdx = body.indexOf(stateEndMarker);
              if (stateStartIdx !== -1 && stateEndIdx !== -1) {
                body = body.substring(0, stateStartIdx + stateStartMarker.length) +
                       '\n' + stateContent + '\n' +
                       body.substring(stateEndIdx);
              }

              // Update ACTIONS section — conditional on sync status
              let actionsContent;
              if (syncStatus === 'created') {
                actionsContent = '_No actions available - release is published._';
              } else if (syncStatus === 'failed') {
                actionsContent = '**Manual action required:** Create post-release sync PR manually (update README and CHANGELOG on main), then close this issue.';
              } else if (syncStatus === 'no_changes') {
                actionsContent = '**Manual action required:** Verify README and CHANGELOG on main are correct, then close this issue.';
              } else {
                actionsContent = '**Manual action required:** Verify post-release sync status, then close this issue.';
              }
              const actionsStartMarker = '<!-- BEGIN:ACTIONS -->';
              const actionsEndMarker = '<!-- END:ACTIONS -->';
              const actionsStartIdx = body.indexOf(actionsStartMarker);
              const actionsEndIdx = body.indexOf(actionsEndMarker);
              if (actionsStartIdx !== -1 && actionsEndIdx !== -1) {
                body = body.substring(0, actionsStartIdx + actionsStartMarker.length) +
                       '\n' + actionsContent + '\n' +
                       body.substring(actionsEndIdx);
              }

              // Update issue body
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });

              // Update labels - remove old state labels, add published
              const currentLabels = issue.labels.map(l => l.name);
              const oldStateLabels = currentLabels.filter(l => l.startsWith('release-state:'));
              for (const label of oldStateLabels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label
                  });
                } catch (e) { /* ignore */ }
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['release-state:published']
              });

              // Close the issue only if sync PR was created successfully
              if (syncStatus === 'created') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`Issue #${issueNumber} closed successfully`);
              } else {
                console.log(`Issue #${issueNumber} left open — sync status: ${syncStatus}`);
              }
            } catch (error) {
              console.log(`::warning::Failed to close issue: ${error.message}`);
              // Non-fatal - the release was already published
            }
