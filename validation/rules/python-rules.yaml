# Python check rule metadata.
# These checks have context-dependent behavior: conditional levels based on
# branch type, API maturity, and release context; applicability conditions
# for release-review and release-plan-changed contexts.
# Engine messages from make_finding() are preserved by default (design doc 8.4.1).
# message_override and hint can be added when engine messages are insufficient.

# P-001: check-filename-kebab-case
- id: P-001
  engine: python
  engine_rule: check-filename-kebab-case
  short_title: "API filename must be kebab-case"
  conditional_level:
    default: error

# P-002: check-filename-matches-api-name
# Draft entries are intentionally allowed to have no spec file yet
# (placeholder for upcoming work). Downgrade to hint for draft so the
# missing file still surfaces in the codeowner annotation list, but
# stays an error for alpha/rc/public where it gates release advancement.
- id: P-002
  engine: python
  engine_rule: check-filename-matches-api-name
  short_title: "API definition file must match release-plan api_name"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-002-api-file-exists"
  conditional_level:
    default: error
    overrides:
      - condition:
          target_api_status: [draft]
        level: hint
  suggestion: >-
    Spec file not yet present. For draft entries this is acceptable;
    add the spec file before advancing target_api_status to alpha.

# P-003: check-info-version-format
- id: P-003
  engine: python
  engine_rule: check-info-version-format
  short_title: "info.version must be wip on main or maintenance"
  conditional_level:
    default: error

# P-004: check-server-url-version
- id: P-004
  engine: python
  engine_rule: check-server-url-version
  short_title: "Server URL must include version segment"
  conditional_level:
    default: error

# P-005: check-server-url-api-name
- id: P-005
  engine: python
  engine_rule: check-server-url-api-name
  short_title: "Server URL api-name must match release-plan"
  conditional_level:
    default: error

# P-006: check-test-files-exist
#
# Severity ramps on target_api_status (the canonical content-ramp field; see
# severity-assignment-guide.md §2), anchored on the public/stable obligation
# with overrides only demoting:
#   - default (stable @ rc/public): error
#   - draft/alpha (either maturity): hint
#   - initial (0.x) @ rc/public: warn
- id: P-006
  engine: python
  engine_rule: check-test-files-exist
  short_title: "Missing test definition file for API"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-006-missing-test-files"
  conditional_level:
    default: error
    overrides:
      - condition:
          target_api_status: [draft, alpha]
        level: hint
      - condition:
          target_api_maturity: [initial]
          target_api_status: [rc, public]
        level: warn
  suggestion: >-
    Test files are optional for alpha releases but expected before the
    first release candidate. On stable (>=1.x) APIs they are required
    at rc and public release; on initial (0.x) APIs they are strongly
    recommended. See CAMARA Testing Guidelines for the expected file
    layout.

# P-007: check-test-file-version
# Parses the Feature line of .feature files to extract the version
# (e.g. "Feature: CAMARA API, vwip - Operation foo") and compares
# against the expected version from info.version.
#
# Severity ramps on target_api_status, anchored on the public/stable
# obligation (warn); initial (0.x) APIs stay at hint throughout.
- id: P-007
  engine: python
  engine_rule: check-test-file-version
  short_title: "Test file: feature-line version mismatch"
  conditional_level:
    default: warn
    overrides:
      - condition:
          target_api_status: [draft, alpha]
        level: hint
      - condition:
          target_api_maturity: [initial]
        level: hint

# P-008: check-test-directory-exists
#
# Severity ramps on target_api_status, anchored on the public/stable
# obligation (warn); no maturity split.
- id: P-008
  engine: python
  engine_rule: check-test-directory-exists
  short_title: "Test_definitions directory is missing"
  conditional_level:
    default: warn
    overrides:
      - condition:
          target_api_status: [draft, alpha]
        level: hint

# P-009: check-release-plan-semantics
- id: P-009
  engine: python
  engine_rule: check-release-plan-semantics
  short_title: "release-plan.yaml has semantic error"
  release_plan_check_only_safe: true
  applicability:
    release_plan_changed: true
  conditional_level:
    default: error

# P-010 (check-changelog-format) retired — no Commonalities / Design Guide
# foundation; the per-API CHANGELOG structure is now produced automatically by
# the release-automation snapshot step. See tooling#208.

# P-011: check-commonalities-version (DG-028 rewrite)
# Validates info.x-camara-commonalities presence and version format.
# Error for missing or invalid format; warn for version mismatch.
- id: P-011
  engine: python
  engine_rule: check-commonalities-version
  short_title: "info.x-camara-commonalities missing or wrong"
  conditional_level:
    default: error

# P-012: check-release-review-file-restriction
- id: P-012
  engine: python
  engine_rule: check-release-review-file-restriction
  short_title: "Release Review PR: only docs may change"
  applicability:
    is_release_review_pr: true
  conditional_level:
    default: error

# P-013: check-readme-placeholder-removal
- id: P-013
  engine: python
  engine_rule: check-readme-placeholder-removal
  short_title: "Remove placeholder README alongside API definitions"
  conditional_level:
    default: warn

# P-014: check-subscription-filename (DG-088)
# Explicit subscription API names must end with '-subscriptions'.
- id: P-014
  engine: python
  engine_rule: check-subscription-filename
  short_title: "Subscription API name must end with -subscriptions"
  applicability:
    api_pattern: [explicit-subscription]
  conditional_level:
    default: warn

# P-015: check-event-type-format (DG-086)
# Event types must follow org.camaraproject.<api-name>.<vN>.<event-name>.
# Gated to Commonalities >=r4.2, where the named ApiEventType schema
# pattern (via $ref to CAMARA_event_common.yaml) is established and the
# hint below is actionable.
#
# Level is conditional on api_pattern:
#   - explicit-subscription: error
#   - implicit-subscription: warn (conservative during migration to the
#     named ApiEventType pattern)
- id: P-015
  engine: python
  engine_rule: check-event-type-format
  short_title: "CloudEvent type format is wrong"
  applicability:
    api_pattern: [explicit-subscription, implicit-subscription]
    commonalities_release: ">=r4.2"
  conditional_level:
    default: error
    overrides:
      - condition:
          api_pattern: [implicit-subscription]
        level: warn
  suggestion: >-
    Define a named event type schema (e.g. ApiEventType) that constrains
    the CloudEvent `type` value via allOf, rather than inlining the enum
    directly in CloudEvent.properties.type.enum. See the implicit-events
    API template in Commonalities artifacts/api-templates/ (tracked in
    camaraproject/Commonalities#608).

# P-016: check-sinkcredential-secrets-writeonly (DG-092)
# r4.3 (Commonalities#633) replaced the blanket "sinkCredential MUST NOT
# appear in responses" ban with a partial-disclosure model: sinkCredential
# MAY appear in POST/GET responses, but its secret sub-fields — accessToken,
# accessTokenType (AccessTokenCredential); clientId, tokenUri
# (PrivateKeyJWTCredential) — MUST be writeOnly so they are withheld.
# credentialType, accessTokenExpiresUtc, and jwksUri are response-visible
# by design and are not checked. Gated ">=r4.3" because writeOnly on these
# fields was introduced there (Commonalities 0.8.0) — a pre-0.8.0 API
# follows the old blanket-ban model and has no writeOnly concept to check.
# Graded ramp mirrors the r4.3 drift-rule siblings P-026/P-027: warn gives
# a migration runway for a just-upgraded API whose copied subtypes predate
# the markers; error at public is the right gate since the escalation only
# ever hits secret fields no legitimate consumer ever received in a
# response under any model. Tracked in tooling#297.
- id: P-016
  engine: python
  engine_rule: check-sinkcredential-secrets-writeonly
  short_title: "sinkCredential secret fields must be writeOnly"
  applicability:
    api_pattern: [explicit-subscription, implicit-subscription]
    commonalities_release: ">=r4.3"
  conditional_level:
    default: warn
    overrides:
      - condition:
          target_api_status: [public]
        level: error

# P-017: check-conflict-deprecated (DG-018)
# CONFLICT error code is deprecated in Commonalities r4.x.
- id: P-017
  engine: python
  engine_rule: check-conflict-deprecated
  short_title: "CONFLICT error code is deprecated"
  applicability:
    commonalities_release: ">=r4.0"
  conditional_level:
    default: warn

# P-018: check-contextcode-format (DG-011)
# contextCode enum values should follow SCREAMING_SNAKE_CASE.
- id: P-018
  engine: python
  engine_rule: check-contextcode-format
  short_title: "contextCode must be SCREAMING_SNAKE_CASE enum"
  applicability:
    commonalities_release: ">=r4.0"
  conditional_level:
    default: hint

# P-019: check-orphan-api-definitions (NEW-003)
# YAML files in API_definitions not listed in release-plan.yaml.
- id: P-019
  engine: python
  engine_rule: check-orphan-api-definitions
  short_title: "API YAML not listed in release-plan.yaml"
  conditional_level:
    default: warn

# P-020: check-cloudevent-via-ref
# Subscription APIs should consume CloudEvent via $ref to
# CAMARA_event_common.yaml rather than maintaining a local inline copy.
# Detection: components.schemas.CloudEvent exists with top-level
# `properties`. The $ref-only and `allOf: [{$ref: ...}]` forms have no
# top-level `properties` and are not flagged.
# Gated to Commonalities >=r4.2, where CAMARA_event_common.yaml exists.
# Skipped on Release Review PRs, where inline CloudEvent is the expected
# output of bundling rather than drift.
- id: P-020
  engine: python
  engine_rule: check-cloudevent-via-ref
  short_title: "CloudEvent should be $ref, not inline"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-020-cloudevent-ref"
  applicability:
    api_pattern: [explicit-subscription, implicit-subscription]
    commonalities_release: ">=r4.2"
    is_release_review_pr: false
  conditional_level:
    default: warn
  suggestion: >-
    Replace the local CloudEvent schema with
    `$ref: './CAMARA_event_common.yaml#/components/schemas/CloudEvent'`,
    or an allOf combining the $ref with an API-specific ApiEventType
    schema. See implicit-events API template in Commonalities
    artifacts/api-templates/.

# P-021: check-common-cache-sync
# Safety check: code/common/ files must match the sync manifest written
# by the RA sync-common handler.  Suppressed on bump PRs via the
# three-step consistency model.  Version-gated to repos adopting $ref
# consumption (>=r4.2).
- id: P-021
  engine: python
  engine_rule: check-common-cache-sync
  short_title: "code/common/ is missing or out of sync"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-021-common-cache-sync"
  applicability:
    release_plan_changed: false
    commonalities_release: ">=r4.2"
  conditional_level:
    default: warn
    overrides:
      - condition:
          trigger_types: [release-automation]
        level: error
  suggestion: >-
    `code/common/` is managed by the sync mechanism. If your PR diff
    includes manual edits to `code/common/`, revert them. If your branch
    is missing files that should be present, merge `main` into your
    branch — it carries the latest synced files; if `main` is also
    behind, merge the auto-created sync PR or dispatch the release
    automation workflow.

# P-022: check-release-plan-exclusivity
# release-plan.yaml changes must be in their own PR — any co-changed
# files are reported so that any new validation errors stay clearly
# attributable to the release-plan change rather than masked by
# unrelated code changes in the same PR.
- id: P-022
  engine: python
  engine_rule: check-release-plan-exclusivity
  short_title: "release-plan.yaml must change in its own PR"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-022-release-plan-exclusivity"
  release_plan_check_only_safe: true
  applicability:
    release_plan_changed: true
  conditional_level:
    default: error
  suggestion: >-
    Split this PR: keep release-plan.yaml changes in a dedicated PR,
    and move the other listed files to a separate PR.

# P-023: check-declared-dependency-tags-exist
# When a dependency declaration (commonalities_release or icm_release)
# advances in this PR, verify the declared tag exists in the source
# repository.  Confirmed missing → error; API lookup failure → warn.
# When the declaration is unchanged in the diff, the check is skipped
# (pre-existing state is not this PR's responsibility).
- id: P-023
  engine: python
  engine_rule: check-declared-dependency-tags-exist
  short_title: "Declared dependency tag not found upstream"
  release_plan_check_only_safe: true
  applicability:
    release_plan_changed: true
  conditional_level:
    default: error

# P-024: check-test-file-feature-line-untransformable
# Fires under either of two conditions in a `.feature` file:
#   1. No `Feature:` line is present in the first 50 lines.
#   2. The `Feature:` line is present but carries no `wip`, `vwip`, or
#      `v{version}` token to indicate the API version.
# Comment lines, feature-level tags, and blank lines preceding `Feature:`
# are valid Gherkin and are skipped during the scan. The check emits a
# distinct message per condition. Always error: distinct from P-007
# (which covers the "version present but mismatched" case under
# conditional_level hint/warn). P-007 and P-024 are mutually exclusive
# per the check's code path (`continue` after each P-024 branch prevents
# both from firing on the same file).
- id: P-024
  engine: python
  engine_rule: check-test-file-feature-line-untransformable
  short_title: "Feature line has no wip/vwip/version token"
  conditional_level:
    default: error

# P-025: check-feature-file-url-version
# Validates that URL paths inside .feature scenario steps carry the
# expected version segment derived from info.version. Sibling to P-004
# (which covers servers[].url in API YAMLs). Unlike Feature-line `wip`
# (covered by P-007), a URL path version has no style-variation escape
# hatch: bare `/wip` is never valid because snapshot transformation
# T2b rewrites only the strict `/vwip` form. Always error.
- id: P-025
  engine: python
  engine_rule: check-feature-file-url-version
  short_title: "Feature-step URL version segment wrong"
  conditional_level:
    default: error

# P-026..P-031: mandatory info.description content validation.
#
# Six rules emitted by a single check function (check_info_description_templates)
# in info_description_checks.py.  Only P-026's engine_rule is registered as a
# CheckDescriptor — P-027..P-031 are satellite engine_rule values discovered
# via emitted findings, same pattern as P-024 alongside P-007.
#
# Activation gated commonalities_release >= r4.3 at the rule-metadata layer.
# Mechanism design: validation/docs/CAMARA-Validation-Framework-Info-Description-Design.md

# P-026: a universal template's BEGIN/END pair is absent from info.description.
- id: P-026
  engine: python
  engine_rule: check-info-description-mandatory-missing
  short_title: "Mandatory info.description template missing"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-026-p-027-info-description-mandatory"
  applicability:
    commonalities_release: ">=r4.3"
  conditional_level:
    default: warn
    overrides:
      - condition:
          target_api_status: [alpha]
        level: hint
      - condition:
          target_api_status: [public]
        level: error
  suggestion: >-
    Paste the missing BEGIN..END block from
    code/common/info-description-templates.yaml under the template name
    reported in the message into info.description.

# P-027: a template's delimiter pair is present but content has drifted
# from canonical (paragraph-normalised diff).
- id: P-027
  engine: python
  engine_rule: check-info-description-mandatory-drift
  short_title: "info.description mandatory template content drift"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-026-p-027-info-description-mandatory"
  applicability:
    commonalities_release: ">=r4.3"
  conditional_level:
    default: warn
    overrides:
      - condition:
          target_api_status: [alpha]
        level: hint
      - condition:
          target_api_status: [public]
        level: error
  suggestion: >-
    Re-copy the BEGIN..END block from
    code/common/info-description-templates.yaml to replace the drifted
    content; the message identifies the first differing paragraph.

# P-028: the same template name's BEGIN/END pair appears more than once
# in info.description.  Always error — duplicate templates are a clear
# authoring mistake regardless of API status.
- id: P-028
  engine: python
  engine_rule: check-info-description-mandatory-duplicate
  short_title: "Duplicate info.description mandatory template"
  applicability:
    commonalities_release: ">=r4.3"
  conditional_level:
    default: error
  suggestion: >-
    Remove the duplicate occurrences; each mandatory template appears at
    most once in info.description.

# P-029: a delimiter uses a template name not in the canonical catalog,
# or marker pairs are unbalanced (BEGIN without END, etc.).  Warning —
# the rule cannot infer whether the codeowner meant a different template
# or intended a different mechanism entirely.
- id: P-029
  engine: python
  engine_rule: check-info-description-mandatory-unknown-template-name
  short_title: "Unknown info.description mandatory template name"
  applicability:
    commonalities_release: ">=r4.3"
  conditional_level:
    default: warn

# P-030: info.description uses YAML folded scalar (>, >-, >+).  Folded
# scalars collapse line breaks into spaces, flattening the BEGIN/END
# markers into paragraphs and silencing the other four rules.  Warning,
# always — independent of target_api_status.
- id: P-030
  engine: python
  engine_rule: check-info-description-folded-scalar
  short_title: "info.description uses YAML folded scalar"
  applicability:
    commonalities_release: ">=r4.3"
  conditional_level:
    default: warn
  suggestion: >-
    Change 'description: >' to 'description: |' so line-anchored
    mandatory-template markers survive YAML parsing.

# P-031: the canonical template file is unavailable, so P-026..P-030
# cannot validate mandatory info.description blocks.  Warning — this is
# normally paired with the common-cache sync finding and explains the
# otherwise silent coverage gap.
- id: P-031
  engine: python
  engine_rule: check-info-description-canonical-missing
  short_title: "info.description canonical template file missing"
  applicability:
    commonalities_release: ">=r4.3"
  conditional_level:
    default: warn
  suggestion: >-
    `code/common/` is managed by the sync mechanism. If your branch is
    missing code/common/info-description-templates.yaml, merge `main` into
    your branch when `main` already carries the latest synced files; if
    `main` is also behind, merge the auto-created sync PR or dispatch the
    release automation workflow to create the sync PR again.

# P-032: check-api-readiness-checklist-removal
# API readiness checklist files moved to canonical ReleaseManagement
# documentation; repo-local checklist files should be deleted from API repos.
- id: P-032
  engine: python
  engine_rule: check-api-readiness-checklist-removal
  short_title: "Remove API readiness checklist file from API repo"
  applicability:
    commonalities_release: ">=r4.3"
  conditional_level:
    default: error
    overrides:
      - condition:
          target_release_type: [none, pre-release-alpha, pre-release-rc]
        level: warn
  suggestion: >-
    Delete the obsolete API readiness checklist file(s). It is replaced by the
    new Release process and API Readiness documentation.

# P-033: check-release-plan-active-release-state
# release-plan.yaml edits are blocked while a release snapshot is active.
# The workflow layer derives release state and the Python check consumes
# the compact outputs offline.
- id: P-033
  engine: python
  engine_rule: check-release-plan-active-release-state
  short_title: "release-plan.yaml blocked during active release"
  release_plan_check_only_safe: true
  applicability:
    trigger_types: [pr]
    release_plan_changed: true
  conditional_level:
    default: error
  suggestion: >-
    Finish, discard, or publish the active snapshot before changing
    release-plan.yaml.

# P-034: check-release-plan-api-names-unique
# A release plan must have at most one entry per api_name.  This runs on
# release-plan PRs and unrelated PRs so pre-existing plan defects are visible.
- id: P-034
  engine: python
  engine_rule: check-release-plan-api-names-unique
  short_title: "release-plan api_name values must be unique"
  release_plan_check_only_safe: true
  conditional_level:
    default: error
  suggestion: >-
    Keep exactly one entry for each api_name. If the plan needs a fix,
    submit a dedicated release-plan PR.

# P-035: check-release-plan-published-history
# Repository-level release-plan consistency against workflow-resolved
# published release metadata, including already-published target tag locks.
- id: P-035
  engine: python
  engine_rule: check-release-plan-published-history
  short_title: "release-plan must stay consistent with published history"
  release_plan_check_only_safe: true
  conditional_level:
    default: error

# P-036: check-release-plan-terminal-api-status
# API versions already published in public or maintenance releases must keep
# their published status if the same version appears again.
- id: P-036
  engine: python
  engine_rule: check-release-plan-terminal-api-status
  short_title: "published API versions must keep their status"
  release_plan_check_only_safe: true
  conditional_level:
    default: error
  suggestion: >-
    Keep target_api_status aligned with the published version, or bump
    target_api_version before changing API status.

# P-037: check-yaml-parser-conformance
# Advisory YAML parser compatibility probe for OpenAPI definition files.
- id: P-037
  engine: python
  engine_rule: check-yaml-parser-conformance
  short_title: "OpenAPI YAML fails parser conformance"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-037-yaml-parser-conformance"
  conditional_level:
    default: warn
  suggestion: >-
    Prefer block-style YAML for examples. Rewrite invalid JSON-like flow-style
    YAML mappings or sequences so the file parses with YAML 1.2-conformant
    parsers.

# P-038: check-externaldocs-repository (DG §5.4)
# externalDocs must reference the canonical CAMARA GitHub repository for
# this API. Fires when externalDocs is missing entirely, or url is not
# exactly https://github.com/camaraproject/{repo-name}. No carve-out for
# intentional cross-repository references — Design Guide §5.4 is a hard
# SHALL and a full upstream/apis/* sweep found zero legitimate cross-repo
# cases; every mismatch was a stale copy-paste or repo rename.
- id: P-038
  engine: python
  engine_rule: check-externaldocs-repository
  short_title: "externalDocs.url must reference this repository"
  conditional_level:
    default: warn
  suggestion: >-
    Set externalDocs.url to https://github.com/camaraproject/{repo-name},
    replacing {repo-name} with this repository's actual name.

# P-039: check-externaldocs-description (DG §5.4)
# externalDocs.description must exactly match the Design Guide template
# text. Satellite rule emitted by check_externaldocs() alongside P-038 —
# only fires when externalDocs is present at all (a missing object is a
# single P-038 finding, not P-038 + P-039).
- id: P-039
  engine: python
  engine_rule: check-externaldocs-description
  short_title: "externalDocs.description must match the DG template"
  conditional_level:
    default: hint
  suggestion: >-
    Set externalDocs.description to exactly "Product documentation at
    CAMARA".

# P-040: check-component-renaming-conflict
# Redocly's bundler silently disambiguates when a local component and a
# different-content component pulled in via an external $ref compete for the
# same name: the local definition keeps the name, the external one is
# renamed to <Name>-2 and every use site that resolved to it is repointed.
# A same-name-same-content proxy/alias is never flagged. error only at
# public, warn everywhere else — deliberately skips both the "new
# requirement" warn-only ramp and the initial-API (0.x) relaxation: the fix
# has no wire-format/backward-compatibility cost, so there is nothing for
# either convention to protect.
- id: P-040
  engine: python
  engine_rule: check-component-renaming-conflict
  short_title: "Component-renaming collision during bundling"
  documentation_url: "https://github.com/camaraproject/tooling/blob/main/documentation/validation/faq.md#p-040-component-renaming-conflict"
  conditional_level:
    default: error
    overrides:
      - condition:
          target_api_status: [draft, alpha, rc]
        level: warn
  suggestion: >-
    Give the local component a distinct, API-specific name — the common
    definition isn't yours to rename. If it isn't actually needed locally,
    reference the common component directly instead.
