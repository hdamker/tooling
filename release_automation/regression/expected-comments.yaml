# Expected leading title of the final bot comment on the Release Issue
# when each canary phase completes on the green path.
#
# This is a test assertion, not a captured artifact. When the RA workflow
# changes the template used for a given command, edit this file alongside
# the workflow change.
#
# Titles are taken from the first line of
#   release_automation/templates/bot_messages/<template>.md
# and truncated at the first dynamic portion (after the static prefix).
# A comment matches if its first non-blank line starts with the prefix.
#
# Source templates:
#   snapshot_created.md   -> "**✅ Snapshot created — State: `snapshot-active`**"
#   snapshot_discarded.md -> "**🗑️ Snapshot discarded — State: `planned`**"
#   interim_processing.md -> "**⏳ Processing: `/{{command}}`**"
#     (/sync-issue has no result template; post-result renders this one)
#   command_rejected.md   -> "**❌ Command rejected: `/{{command}}` — State: `{{state}}`**"
#   issue_reopened.md     -> "**🔄 Issue reopened — State: `{{state}}`**"
#   issue_created.md      -> "**📋 Release issue created — State: `planned`**"

create-snapshot: "**✅ Snapshot created"
discard-snapshot: "**🗑️ Snapshot discarded"
sync-issue: "**⏳ Processing: `/sync-issue`"
# /discard-snapshot posted in `planned`
rejected-discard-snapshot: "**❌ Command rejected: `/discard-snapshot`"
# Release Issue closed in `snapshot-active` (issue_close auto-reopen)
issue-close: "**🔄 Issue reopened"
# Release Issue closed in `planned` (a new Release Issue is created)
issue-close-planned: "**📋 Release issue created"
