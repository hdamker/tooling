# CAMARA Release Automation — Caller Workflow
#
# Installed in API repositories by the CAMARA onboarding campaign
# (camaraproject/project-administration). No modification needed;
# all configuration is centralized in camaraproject/tooling.
#
# Triggers:
# - Slash commands: /create-snapshot, /discard-snapshot, /delete-draft,
#   /publish-release, /sync-issue
# - Issue events: close (with auto-reopen), reopen
# - PR merge: on release-snapshot branches (creates draft release)
# - Push to main or a maintenance/rX branch: on release-plan.yaml,
#   code/common/**, or this caller workflow itself. All three paths end up
#   running sync-issue for that branch's release line so the Release Issue
#   body reflects the current repo state — most notably, pushing to
#   code/common/** (typically after a sync PR merge) refreshes the
#   common-cache status in the Release Issue and clears any stale warning.
# - Manual: workflow_dispatch with action
#   - sync-issue (default): sync the Release Issue of the selected branch
#   - create-maintenance-branch: create maintenance/<cycle> for a release
#     cycle (e.g. r1) once main plans a later cycle; codeowners only
#
# A maintenance/rX branch carries its own copy of this file (pushes and PRs
# run the copy of their branch); create-maintenance-branch copies main's.

name: CAMARA Release Automation

on:
  # Slash commands via issue comments
  issue_comment:
    types: [created]

  # Issue close/reopen events
  issues:
    types: [closed, reopened]

  # PR merge to snapshot branches
  pull_request:
    types: [closed]
    branches:
      - 'release-snapshot/**'

  # Push to main or a maintenance branch with release-plan.yaml, common file,
  # or caller workflow changes. Listing the caller itself as a path ensures
  # the workflow runs once right after it is merged (future caller updates
  # pick up their own trigger).
  push:
    branches:
      - main
      - 'maintenance/**'
    paths:
      - 'release-plan.yaml'
      - 'code/common/**'
      - '.github/workflows/release-automation.yml'

  # Manual trigger. sync-issue: initial setup, recovery after manual repo
  # changes, or forced sync. All release commands are slash commands in the
  # Release Issue.
  workflow_dispatch:
    inputs:
      action:
        description: "sync-issue, or create-maintenance-branch (run from main)"
        type: choice
        options:
          - sync-issue
          - create-maintenance-branch
        default: sync-issue
      cycle:
        description: "Release cycle for create-maintenance-branch, e.g. r1"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-automation:
    # Skip if:
    # - issue_comment or issues event from the RA bot itself (to prevent self-triggering)
    # - issue_comment but not a release command or not on a release issue
    # - issues event but not a release issue
    # - pull_request but not merged or not to a snapshot branch
    if: |
      (github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login != 'camara-release-automation[bot]' &&
       contains(github.event.issue.labels.*.name, 'release-issue') &&
       (startsWith(github.event.comment.body, '/create-snapshot') ||
        startsWith(github.event.comment.body, '/discard-snapshot') ||
        startsWith(github.event.comment.body, '/delete-draft') ||
        startsWith(github.event.comment.body, '/publish-release') ||
        startsWith(github.event.comment.body, '/sync-issue'))) ||
      (github.event_name == 'issues' &&
       github.event.sender.login != 'camara-release-automation[bot]' &&
       contains(github.event.issue.labels.*.name, 'release-issue')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.base.ref, 'release-snapshot/'))

    # Serialize release automation runs per repository. Job level, so runs
    # skipped by the if: above never join the group. With cancel-in-progress:
    # false, queued runs wait for the current run to complete.
    # Note: GitHub allows at most 1 running + 1 pending per concurrency group.
    # A third arrival replaces the pending run; a replaced push, merge or
    # dispatch run shows as cancelled and can be re-run from its run page.
    concurrency:
      group: release-automation-${{ github.repository }}
      cancel-in-progress: false

    uses: camaraproject/tooling/.github/workflows/release-automation-reusable.yml@v1-rc
    secrets: inherit
